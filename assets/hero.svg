<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Universal Agent Plugins</title>
  <desc id="desc">Install more than 2,500 Agent Plugins across compatible AI agents with one CLI.</desc>
  <defs>
    <linearGradient id="background" x1="60" y1="20" x2="1540" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11162E"/>
      <stop offset=".48" stop-color="#0A1023"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(1270 85) rotate(150) scale(420 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7257FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7257FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientTransform="translate(1190 355) rotate(-120) scale(330 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21C8E7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#21C8E7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="1180" y1="130" x2="1370" y2="295" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8C6DFF"/>
      <stop offset=".52" stop-color="#387BFF"/>
      <stop offset="1" stop-color="#20C8E8"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1600" height="420" rx="32" fill="url(#background)"/>
  <rect width="1600" height="420" rx="32" fill="url(#violet)"/>
  <rect width="1600" height="420" rx="32" fill="url(#cyan)"/>
  <g opacity=".16" fill="#DDE7FF">
    <circle cx="105" cy="52" r="2"/><circle cx="1430" cy="58" r="2"/><circle cx="1490" cy="365" r="2"/>
    <circle cx="850" cy="62" r="2"/><circle cx="790" cy="370" r="2"/><circle cx="1400" cy="255" r="2"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="88" y="76" fill="#9BA9C7" font-size="23" font-weight="650" letter-spacing="2.8">2500+ PLUGINS · ONE COMMAND</text>
    <text x="84" y="157" fill="#F7F9FF" font-size="66" font-weight="760" letter-spacing="-2.5">Universal Agent Plugins</text>
    <text x="88" y="211" fill="#BFC9DF" font-size="26" font-weight="450">Install plugins across AI agents with one command.</text>
    <g font-size="18" font-weight="650">
      <rect x="88" y="246" width="212" height="48" rx="24" fill="#7257FF" fill-opacity=".19" stroke="#8E79FF" stroke-opacity=".5"/>
      <text x="114" y="277" fill="#C9BFFF">Agent Plugins 1.0</text>
      <rect x="316" y="246" width="164" height="48" rx="24" fill="#20C8E8" fill-opacity=".13" stroke="#28C5E6" stroke-opacity=".42"/>
      <text x="345" y="277" fill="#AEEEF7">Skills + MCP</text>
      <rect x="496" y="246" width="154" height="48" rx="24" fill="#FF806E" fill-opacity=".12" stroke="#FF806E" stroke-opacity=".38"/>
      <text x="526" y="277" fill="#FFC1B6">Apache 2.0</text>
    </g>
    <text x="88" y="353" fill="#7E8AA5" font-size="20">Add · update · repair · remove with agentplugins</text>
  </g>
  <circle cx="1270" cy="214" r="145" fill="#4D6FFF" opacity=".18" filter="url(#blur)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M1270 144V92" stroke="#8E79FF" stroke-width="17"/>
    <path d="M1194 254L1092 330" stroke="#28C5E6" stroke-width="17"/>
    <path d="M1346 254L1448 330" stroke="#FF806E" stroke-width="17"/>
    <path d="M1185 182L1084 146" stroke="#387BFF" stroke-width="14" opacity=".68"/>
    <path d="M1355 182L1456 146" stroke="#63A0FF" stroke-width="14" opacity=".62"/>
  </g>
  <rect x="1170" y="126" width="200" height="176" rx="52" fill="url(#core)"/>
  <rect x="1230" y="36" width="80" height="72" rx="25" fill="#8E79FF"/>
  <rect x="1022" y="306" width="88" height="76" rx="27" fill="#28C5E6"/>
  <rect x="1430" y="306" width="88" height="76" rx="27" fill="#FF806E"/>
  <rect x="1018" y="112" width="76" height="68" rx="24" fill="#387BFF" opacity=".9"/>
  <rect x="1446" y="110" width="76" height="68" rx="24" fill="#63A0FF" opacity=".9"/>
  <path d="M1235 184h70a23 23 0 0 1 23 23v29a23 23 0 0 1-23 23h-70a23 23 0 0 1-23-23v-29a23 23 0 0 1 23-23Z" fill="#F8FAFF"/>
  <path d="M1252 162v24m36-24v24m-36 73v24m36-24v24" stroke="#F8FAFF" stroke-width="13" stroke-linecap="round"/>
</svg>
