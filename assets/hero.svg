    <path d="M1109 482L972 596" stroke="#28C5E6" stroke-width="24"/>
    <path d="M1293 482L1430 596" stroke="#FF806E" stroke-width="24"/>
    <path d="M1098 388L940 336" stroke="#387BFF" stroke-width="18" opacity=".68"/>
    <path d="M1304 388L1460 332" stroke="#63A0FF" stroke-width="18" opacity=".62"/>
  </g>
  <rect x="1088" y="310" width="226" height="226" rx="66" fill="url(#core)"/>
  <rect x="1146" y="143" width="110" height="110" rx="34" fill="#8E79FF"/>
  <rect x="871" y="574" width="110" height="110" rx="34" fill="#28C5E6"/>
  <rect x="1421" y="574" width="110" height="110" rx="34" fill="#FF806E"/>
  <rect x="867" y="282" width="92" height="92" rx="29" fill="#387BFF" opacity=".9"/>
