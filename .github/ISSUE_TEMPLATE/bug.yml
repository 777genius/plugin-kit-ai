name: Bug report
description: Report a package, validation, install, or runtime problem
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Never include tokens, cookies, OAuth codes, account names, or private content.
  - type: input
    id: plugin
    attributes:
      label: Plugin
      placeholder: context7
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: Codex CLI 0.147.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction in a disposable project
      description: Include the pinned release ref and exact commands or UI steps.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account identifiers, private content, and authorization URLs.
          required: true
