      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-launch-context-${{ github.run_id }}-${{ needs.node22-npm-facade.outputs.evidence_run_attempt }}
          path: prepared-context
      - name: Require the exact prepared challenge for this workflow attempt
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from run_launch_evidence_e2e import SCENARIOS, challenge_context_valid, sha256_file

          context = json.loads(Path("prepared-context/context.json").read_text())
          github = context.get("github", {})
          expected = {
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          if any(str(github.get(key, "")) != value for key, value in expected.items()):
              raise SystemExit("prepared challenge belongs to another workflow attempt; rerun all jobs")
          challenge = context.get("challenge")
          scenario_digest = sha256_file(SCENARIOS)
          if not challenge_context_valid(challenge):
              raise SystemExit("prepared challenge is invalid")
          bindings = {
              "github_sha": expected["sha"],
              "run_id": expected["run_id"],
              "run_attempt": expected["run_attempt"],
              "release_manifest_digest": context.get("release_manifest_digest"),
              "directory_digest": context.get("directory", {}).get("digest"),
              "scenario_contract_digest": scenario_digest,
          }
          if any(challenge.get(key) != value for key, value in bindings.items()):
              raise SystemExit("prepared challenge bindings do not match the protected request")
          if context.get("scenario_contract_digest") != scenario_digest:
              raise SystemExit("prepared scenario contract digest is stale")
          PY
      - name: Obtain short-lived GitHub OIDC identity
        run: |
          response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode 'audience=stable-launch-observer' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          ACTIONS_ID_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$ACTIONS_ID_TOKEN"
          echo "ACTIONS_ID_TOKEN=$ACTIONS_ID_TOKEN" >> "$GITHUB_ENV"
      - name: Validate non-secret OIDC identity claims locally
        env:
          EXPECTED_CALLER_EVENT_NAME: ${{ inputs.caller_event_name }}
          EXPECTED_CALLER_WORKFLOW_REF: ${{ inputs.caller_workflow_ref }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re

          token = os.environ.get("ACTIONS_ID_TOKEN", "")
          parts = token.split(".")
          if len(parts) != 3 or len(token) > 16_384:
              raise SystemExit("OIDC self-check failed: token shape")
          if not re.fullmatch(r"[A-Za-z0-9_-]+", parts[1]):
              raise SystemExit("OIDC self-check failed: payload encoding")
          try:
              claims = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
          except (ValueError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("OIDC self-check failed: payload JSON") from None
          repository = os.environ["GITHUB_REPOSITORY"]
          owner, repository_name = repository.split("/", 1)
          immutable_subject = (
              f"repo:{owner}@{os.environ['GITHUB_REPOSITORY_OWNER_ID']}/"
              f"{repository_name}@{os.environ['GITHUB_REPOSITORY_ID']}:"
              "environment:stable-launch-e2e"
          )
          expected = {
              "iss": "https://token.actions.githubusercontent.com",
              "aud": "stable-launch-observer",
              "sub": immutable_subject,
              "repository": repository,
              "repository_owner": os.environ["GITHUB_REPOSITORY_OWNER"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "repository_owner_id": os.environ["GITHUB_REPOSITORY_OWNER_ID"],
              "ref": "refs/heads/main",
              "ref_type": "branch",
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "environment": "stable-launch-e2e",
              "workflow_ref": os.environ["EXPECTED_CALLER_WORKFLOW_REF"],
              "job_workflow_ref": f"{repository}/.github/workflows/launch-evidence-e2e.yml@refs/heads/main",
              "workflow": "Signed Directory publication",
              "event_name": os.environ["EXPECTED_CALLER_EVENT_NAME"],
              "workflow_sha": os.environ["GITHUB_SHA"],
              "job_workflow_sha": os.environ["GITHUB_SHA"],
          }
          mismatches = sorted(
              field for field, value in expected.items()
              if str(claims.get(field, "")) != str(value)
          )
          missing_security_claims = sorted(
              field for field in ("iat", "nbf", "exp", "jti") if field not in claims
          )
          if mismatches or missing_security_claims:
              fields = ",".join(mismatches + missing_security_claims)
              raise SystemExit(f"OIDC self-check failed: claim mismatch ({fields})")
          print("OIDC identity matches the protected observer policy")
          PY
      - name: Request protected challenge-bound runtime and OAuth observations
        id: observer
        env:
          OBSERVER_ENDPOINT: ${{ vars.STABLE_LAUNCH_OBSERVER_ENDPOINT }}
          OBSERVER_ED25519_PUBLIC_KEY: ${{ vars.STABLE_LAUNCH_OBSERVER_ED25519_PUBLIC_KEY }}
          OBSERVER_KEY_ID: ${{ vars.STABLE_LAUNCH_OBSERVER_KEY_ID }}
        run: |
          test -n "$OBSERVER_ENDPOINT"
          test -n "$OBSERVER_ED25519_PUBLIC_KEY"
          test -n "$OBSERVER_KEY_ID"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from launch_observer_signatures import verify_observer_bundle
          from materialize_launch_evidence import validate_observer_artifact_schemas
          from request_launch_runtime_observations import request_observer_bundle
          from run_launch_evidence_e2e import SCENARIOS, challenge_context_valid, sha256_file

          context = json.loads(Path("prepared-context/context.json").read_text())
          producer_attempt = str(context["github"]["run_attempt"])
          github = context["github"]
          scenario_digest = sha256_file(SCENARIOS)
          expected_identity = {
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          if any(str(github.get(key, "")) != value for key, value in expected_identity.items()):
              raise SystemExit("prepared challenge belongs to another workflow attempt; rerun all jobs")
          if not challenge_context_valid(context.get("challenge")):
              raise SystemExit("prepared challenge is invalid")
          context["producer_run_attempt"] = producer_attempt
          request = {
              "schema_version": 1, "purpose": "stable-launch-e2e",
              "catalog_repository": context["catalog_repository"],
              "cli_release_repository": context["cli_release_repository"],
              "cli_release_tag": context["cli_release_tag"],
              "release_manifest_digest": context["release_manifest_digest"],
              "release_checksums_digest": context["release_checksums_digest"],
              "directory_digest": context["directory"]["digest"],
              "scenario_contract_digest": scenario_digest,
              "github": {key: github[key] for key in ("sha", "run_id", "run_attempt")},
              "challenge": context["challenge"],
          }
          body = json.dumps(request, sort_keys=True, separators=(",", ":")).encode()
          bundle = request_observer_bundle(os.environ["OBSERVER_ENDPOINT"], body, os.environ["ACTIONS_ID_TOKEN"])
          artifacts = verify_observer_bundle(
              bundle, challenge=context["challenge"]["value"],
              public_key_base64=os.environ["OBSERVER_ED25519_PUBLIC_KEY"],
              expected_key_id=os.environ["OBSERVER_KEY_ID"], enforce_freshness=True,
          )
          validate_observer_artifact_schemas(artifacts)
          output = Path("live-inputs")
          output.mkdir()
          (output / "observer-bundle.json").write_text(json.dumps(bundle, indent=2, sort_keys=True) + "\n")
          (output / "context.json").write_text(json.dumps(context, indent=2, sort_keys=True) + "\n")
          for name, artifact in artifacts.items():
              (output / name).write_text(json.dumps(artifact, indent=2, sort_keys=True) + "\n")
          PY
          check-jsonschema --schemafile tests/e2e/schemas/observer-bundle.schema.json live-inputs/observer-bundle.json
          printf 'public_key=%s\n' "$OBSERVER_ED25519_PUBLIC_KEY" >> "$GITHUB_OUTPUT"
          printf 'key_id=%s\n' "$OBSERVER_KEY_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-observer-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-inputs
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - id: identity
        run: echo "run_attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  enforced-stable-gate:
    if: inputs.consent && inputs.publication_id != '' && inputs.publication_sequence != '' && inputs.publication_snapshot_digest != '' && inputs.publication_source_commit != '' && inputs.publication_ledger_commit != '' && (inputs.caller_event_name == 'push' || inputs.caller_event_name == 'schedule' || inputs.caller_event_name == 'workflow_dispatch') && inputs.caller_ref == 'refs/heads/main' && inputs.caller_workflow_ref == format('{0}/.github/workflows/directory-publication.yml@refs/heads/main', github.repository)
