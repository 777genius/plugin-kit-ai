          test "${#value}" -lt "${#maximum}" || { test "${#value}" -eq "${#maximum}" && test "$value" \< "$maximum" -o "$value" = "$maximum"; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - run: python -m pip install cryptography==46.0.3 jsonschema==4.26.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.enforced-stable-gate.outputs.evidence_artifact_name }}
          path: evidence
      - name: Re-derive the exact canonical bundle before attestation
        env:
          OBSERVER_ED25519_PUBLIC_KEY: ${{ vars.STABLE_LAUNCH_OBSERVER_ED25519_PUBLIC_KEY }}
          OBSERVER_KEY_ID: ${{ vars.STABLE_LAUNCH_OBSERVER_KEY_ID }}
        run: |
          test -n "$OBSERVER_ED25519_PUBLIC_KEY" && test -n "$OBSERVER_KEY_ID"
          python scripts/materialize_launch_evidence.py verify-bundle \
            --artifact-dir evidence --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_REPOSITORY/.github/workflows/launch-evidence-e2e.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" --expected-run-attempt "${{ needs.enforced-stable-gate.outputs.evidence_run_attempt }}" \
            --expected-caller-event-name "${{ inputs.caller_event_name }}" --expected-caller-ref "${{ inputs.caller_ref }}" \
            --expected-caller-workflow-ref "${{ inputs.caller_workflow_ref }}" \
            --expected-publication-id "${{ inputs.publication_id }}" \
            --expected-publication-sequence "${{ inputs.publication_sequence }}" \
            --expected-publication-snapshot-digest "${{ inputs.publication_snapshot_digest }}" \
            --expected-publication-source-commit "${{ inputs.publication_source_commit }}" \
            --verify-observer --observer-public-key "$OBSERVER_ED25519_PUBLIC_KEY" \
            --observer-key-id "$OBSERVER_KEY_ID"
      - name: Attest the canonical bundle identity only
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/bundle-identity.json
      - name: Prepare exact offline attestation transport
        id: attestation-identity
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
          EVIDENCE_RUN_ATTEMPT: ${{ needs.enforced-stable-gate.outputs.evidence_run_attempt }}
        run: |
          test -n "$BUNDLE_PATH"
          test -f "$BUNDLE_PATH"
          test ! -L "$BUNDLE_PATH"
          mkdir attestation
          cp -- "$BUNDLE_PATH" attestation/github-attestation.jsonl
          test -s attestation/github-attestation.jsonl
          artifact_name="stable-launch-attestation-${GITHUB_SHA}-${GITHUB_RUN_ID}-${EVIDENCE_RUN_ATTEMPT}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.attestation-identity.outputs.artifact_name }}
          path: attestation/github-attestation.jsonl
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  two-lane-readiness:
    if: always() && needs.attest-stable-evidence.result == 'success' && needs.source-policy-conformance.result == 'success'
    needs: [attest-stable-evidence, source-policy-conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.readiness.outputs.artifact_name }}
      evidence_digest: ${{ steps.readiness.outputs.evidence_digest }}
    steps:
      - name: Validate the unmodified canonical publication sequence
        shell: bash
        env:
          PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
          LC_ALL: C
        run: |
          value="$PUBLICATION_SEQUENCE"
          case "$value" in ""|0*|*[!0-9]*) exit 1 ;; esac
          maximum=9007199254740991
          test "${#value}" -lt "${#maximum}" || { test "${#value}" -eq "${#maximum}" && test "$value" \< "$maximum" -o "$value" = "$maximum"; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - run: python -m pip install check-jsonschema==0.37.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.attest-stable-evidence.outputs.evidence_artifact_name }}
          path: released-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.source-policy-conformance.outputs.artifact_name }}
          path: source-policy
      - name: AND-bind both canonical lanes
        id: readiness
        run: |
          mkdir two-lane-readiness
          python scripts/build_two_lane_readiness.py \
            --runtime released-runtime/launch-evidence.json \
            --policy source-policy/source-policy-conformance.json \
            --uap-sha "$GITHUB_SHA" \
            --directory-ledger-sha "${{ inputs.publication_ledger_commit }}" \
            --publication-id "${{ inputs.publication_id }}" \
            --publication-sequence "${{ inputs.publication_sequence }}" \
            --publication-snapshot-digest "${{ inputs.publication_snapshot_digest }}" \
            --publication-source-commit "${{ inputs.publication_source_commit }}" \
            --output two-lane-readiness/two-lane-readiness.json
          check-jsonschema --schemafile schemas/e2e/two-lane-readiness.schema.json two-lane-readiness/two-lane-readiness.json
          artifact_name="two-lane-readiness-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence_digest="sha256:$(sha256sum two-lane-readiness/two-lane-readiness.json | cut -d' ' -f1)"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "evidence_digest=${evidence_digest}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.readiness.outputs.artifact_name }}
          path: two-lane-readiness/two-lane-readiness.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
