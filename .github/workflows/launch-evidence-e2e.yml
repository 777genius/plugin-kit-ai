name: stable launch evidence E2E

on:
  pull_request:
    paths:
      - "scripts/run_launch_evidence_e2e.py"
      - "scripts/observe_launch_scenario.py"
      - "scripts/launch_observer_signatures.py"
      - "scripts/prepare_launch_evidence.py"
      - "scripts/materialize_launch_evidence.py"
      - "scripts/two_lane_evidence.py"
      - "scripts/run_source_policy_conformance.py"
      - "scripts/build_two_lane_readiness.py"
      - "scripts/observe_release_facade.py"
      - "tests/e2e/**"
      - "schemas/e2e/**"
      - "tests/test_run_launch_evidence_e2e.py"
      - "tests/test_materialize_launch_evidence.py"
      - "tests/test_two_lane_evidence.py"
      - "tests/test_workflow_contracts.py"
      - ".github/workflows/launch-evidence-e2e.yml"
  workflow_call:
    inputs:
      consent:
        description: Protected release caller approved disposable live observations
        required: true
        type: boolean
      publication_id:
        description: Exact signed snapshot publication_id produced by the caller
        required: true
        type: string
      publication_sequence:
        description: Exact staged snapshot sequence produced by the caller
        required: true
        type: string
      publication_snapshot_digest:
        description: Exact sha256 digest of the caller's signed snapshot bytes
        required: true
        type: string
      publication_source_commit:
        description: Exact 40-hex source commit embedded in the signed snapshot
        required: true
        type: string
      publication_ledger_commit:
        description: Exact 40-hex materialized ledger commit containing the staged bytes
        required: true
        type: string
      caller_event_name:
        required: true
        type: string
      caller_ref:
        required: true
        type: string
      caller_workflow_ref:
        required: true
        type: string
    outputs:
      evidence_artifact_name:
        description: Exact Actions transport artifact name
        value: ${{ jobs.attest-stable-evidence.outputs.evidence_artifact_name }}
      launch_evidence_digest:
        description: SHA-256 of canonical launch-evidence.json
        value: ${{ jobs.attest-stable-evidence.outputs.launch_evidence_digest }}
      workflow_source_digest:
        description: Exact protected workflow source commit attested by GitHub
        value: ${{ jobs.attest-stable-evidence.outputs.workflow_source_digest }}
      evidence_run_attempt:
        description: Exact attempt that produced the immutable evidence artifact
        value: ${{ jobs.attest-stable-evidence.outputs.evidence_run_attempt }}
      attestation_artifact_name:
        description: Exact offline GitHub provenance transport artifact
        value: ${{ jobs.attest-stable-evidence.outputs.attestation_artifact_name }}
      source_policy_artifact_name:
        description: Exact source-policy conformance artifact
        value: ${{ jobs.source-policy-conformance.outputs.artifact_name }}
      source_policy_evidence_digest:
        description: SHA-256 of canonical source-policy evidence
        value: ${{ jobs.source-policy-conformance.outputs.evidence_digest }}
      readiness_artifact_name:
        description: Exact two-lane readiness artifact
        value: ${{ jobs.two-lane-readiness.outputs.artifact_name }}
      readiness_evidence_digest:
        description: SHA-256 of canonical two-lane readiness envelope
        value: ${{ jobs.two-lane-readiness.outputs.evidence_digest }}
  workflow_dispatch:
    inputs:
      consent:
        description: I approve disposable live observations
        required: true
        type: boolean
      publication_id:
        description: Exact signed snapshot publication_id to verify
        required: true
        type: string
      publication_sequence:
        description: Exact published snapshot sequence to verify
        required: true
        type: string
      publication_snapshot_digest:
        description: Exact sha256 digest of the signed snapshot bytes
        required: true
        type: string
      publication_source_commit:
        description: Exact 40-hex source commit embedded in the signed snapshot
        required: true
        type: string
      publication_ledger_commit:
        description: Exact 40-hex materialized ledger commit containing the staged bytes
        required: true
        type: string

permissions:
  contents: read

env:
  AGENTPLUGINS_VERSION: "0.1.18"

concurrency:
  group: stable-launch-evidence-${{ github.repository }}-${{ github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  validate-publication-sequence:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Validate the unmodified canonical publication sequence
        shell: bash
        env:
          PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
          LC_ALL: C
        run: |
          value="$PUBLICATION_SEQUENCE"
          case "$value" in ""|0*|*[!0-9]*) exit 1 ;; esac
          maximum=9007199254740991
          test "${#value}" -lt "${#maximum}" || { test "${#value}" -eq "${#maximum}" && test "$value" \< "$maximum" -o "$value" = "$maximum"; }

  fixture-only-non-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install fixture contract dependencies
        run: python -m pip install cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - name: Run honest fixture-only contracts
        run: |
          run_root="${RUNNER_TEMP}/uap-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/run_launch_evidence_e2e.py --mode fixture-only \
            --uap-sha "$GITHUB_SHA" \
            --consent tests/e2e/fixtures/fixture-only-consent.json \
            --run-root "$run_root" --output "$run_root/evidence/launch-evidence.json"
          python -m unittest tests.test_run_launch_evidence_e2e tests.test_materialize_launch_evidence tests.test_workflow_contracts

  native-release:
    needs: [validate-publication-sequence]
    if: inputs.consent && inputs.publication_id != '' && inputs.publication_sequence != '' && inputs.publication_snapshot_digest != '' && inputs.publication_source_commit != '' && inputs.publication_ledger_commit != '' && (inputs.caller_event_name == 'push' || inputs.caller_event_name == 'schedule' || inputs.caller_event_name == 'workflow_dispatch') && inputs.caller_ref == 'refs/heads/main' && inputs.caller_workflow_ref == format('{0}/.github/workflows/directory-publication.yml@refs/heads/main', github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, os: macos, architecture: arm64, asset: agentplugins_0.1.18_darwin_arm64}
          - {runner: macos-15-intel, os: macos, architecture: amd64, asset: agentplugins_0.1.18_darwin_amd64}
          - {runner: ubuntu-24.04-arm, os: linux, architecture: arm64, asset: agentplugins_0.1.18_linux_arm64}
          - {runner: ubuntu-24.04, os: linux, architecture: amd64, asset: agentplugins_0.1.18_linux_amd64}
          - {runner: windows-2025, os: windows, architecture: amd64, asset: agentplugins_0.1.18_windows_amd64.exe}
          - {runner: windows-11-arm, os: windows, architecture: arm64, asset: agentplugins_0.1.18_windows_arm64.exe}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    outputs:
      evidence_run_attempt: ${{ steps.identity.outputs.run_attempt }}
    steps:
      - name: Validate the unmodified canonical publication sequence
        shell: bash
        env:
          PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
          LC_ALL: C
        run: |
          value="$PUBLICATION_SEQUENCE"
          case "$value" in ""|0*|*[!0-9]*) exit 1 ;; esac
          maximum=9007199254740991
          test "${#value}" -lt "${#maximum}" || { test "${#value}" -eq "${#maximum}" && test "$value" \< "$maximum" -o "$value" = "$maximum"; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install verification dependencies
        run: python -m pip install cryptography==46.0.3 jsonschema==4.26.0 tzdata==2026.3
      - name: Resolve the fixed upstream CLI release and staged Directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ matrix.asset }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
          PUBLICATION_SNAPSHOT_DIGEST: ${{ inputs.publication_snapshot_digest }}
          PUBLICATION_SOURCE_COMMIT: ${{ inputs.publication_source_commit }}
          PUBLICATION_LEDGER_COMMIT: ${{ inputs.publication_ledger_commit }}
        run: |
          run_root="${RUNNER_TEMP}/uap-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/prepare_launch_evidence.py --asset-name "$ASSET_NAME" \
            --publication-id "$PUBLICATION_ID" --publication-sequence "$PUBLICATION_SEQUENCE" \
            --publication-snapshot-digest "$PUBLICATION_SNAPSHOT_DIGEST" --publication-source-commit "$PUBLICATION_SOURCE_COMMIT" \
            --publication-ledger-commit "$PUBLICATION_LEDGER_COMMIT" \
            --caller-event-name "${{ inputs.caller_event_name }}" --caller-ref "${{ inputs.caller_ref }}" \
            --caller-workflow-ref "${{ inputs.caller_workflow_ref }}" \
            --run-root "$run_root" --output "$run_root/context.json"
          unset GH_TOKEN GITHUB_TOKEN
          python scripts/observe_release_facade.py --context "$run_root/context.json" \
            --executable "$run_root/release/$ASSET_NAME" --asset-name "$ASSET_NAME" \
            --kind binary --os "${{ matrix.os }}" --architecture "${{ matrix.architecture }}" \
            --output native-observation.json
          sha256sum native-observation.json > native-observation.SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.os }}-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-observation.json
            native-observation.SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - id: identity
        shell: bash
        run: echo "run_attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  node22-npm-facade:
    needs: [validate-publication-sequence]
    if: inputs.consent && inputs.publication_id != '' && inputs.publication_sequence != '' && inputs.publication_snapshot_digest != '' && inputs.publication_source_commit != '' && inputs.publication_ledger_commit != '' && (inputs.caller_event_name == 'push' || inputs.caller_event_name == 'schedule' || inputs.caller_event_name == 'workflow_dispatch') && inputs.caller_ref == 'refs/heads/main' && inputs.caller_workflow_ref == format('{0}/.github/workflows/directory-publication.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    outputs:
      evidence_run_attempt: ${{ steps.identity.outputs.run_attempt }}
    steps:
      - name: Validate the unmodified canonical publication sequence
        shell: bash
        env:
          PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
          LC_ALL: C
        run: |
          value="$PUBLICATION_SEQUENCE"
          case "$value" in ""|0*|*[!0-9]*) exit 1 ;; esac
          maximum=9007199254740991
          test "${#value}" -lt "${#maximum}" || { test "${#value}" -eq "${#maximum}" && test "$value" \< "$maximum" -o "$value" = "$maximum"; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "22"}
      - run: python -m pip install cryptography==46.0.3 jsonschema==4.26.0 tzdata==2026.3
      - name: Resolve and install the exact registry-authenticated npm facade
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
          PUBLICATION_SNAPSHOT_DIGEST: ${{ inputs.publication_snapshot_digest }}
          PUBLICATION_SOURCE_COMMIT: ${{ inputs.publication_source_commit }}
          PUBLICATION_LEDGER_COMMIT: ${{ inputs.publication_ledger_commit }}
        run: |
          run_root="${RUNNER_TEMP}/uap-node22-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/prepare_launch_evidence.py --asset-name agentplugins_0.1.18_linux_amd64 --npm-facade \
            --publication-id "$PUBLICATION_ID" --publication-sequence "$PUBLICATION_SEQUENCE" \
            --publication-snapshot-digest "$PUBLICATION_SNAPSHOT_DIGEST" --publication-source-commit "$PUBLICATION_SOURCE_COMMIT" \
            --publication-ledger-commit "$PUBLICATION_LEDGER_COMMIT" \
            --caller-event-name "${{ inputs.caller_event_name }}" --caller-ref "${{ inputs.caller_ref }}" \
            --caller-workflow-ref "${{ inputs.caller_workflow_ref }}" \
            --run-root "$run_root" --output "$run_root/context.json"
          unset GH_TOKEN GITHUB_TOKEN
          export AGENTPLUGINS_CACHE_DIR="$run_root/npm-binary-cache"
          mkdir "$run_root/npm-audit"
          cd "$run_root/npm-audit"
          npm install --ignore-scripts=false --save-exact universal-agent-plugins@0.1.18
          npm audit signatures
          cd "$GITHUB_WORKSPACE"
          npm install --global "$run_root/npm/universal-agent-plugins-0.1.18.tgz" --ignore-scripts=false
          npm_package_root="$(npm root --global)/universal-agent-plugins"
          test -d "$npm_package_root"
          test "$(node --version | cut -d. -f1)" = v22
          python scripts/observe_release_facade.py --context "$run_root/context.json" \
            --executable "$npm_package_root/bin/agentplugins.js" --asset-name agentplugins_0.1.18_linux_amd64 \
            --kind npm --os any --architecture any --node-major 22 --npm-project "$run_root/npm-audit" \
            --npm-package-root "$npm_package_root" --npm-binary-cache "$AGENTPLUGINS_CACHE_DIR" \
            --output npm-observation.json
          sha256sum npm-observation.json > npm-observation.SHA256SUMS
          mkdir prepared-observer-context prepared-producer-inputs prepared-policy-inputs
          cp "$run_root/context.json" prepared-observer-context/context.json
          cp "$run_root/context.json" prepared-producer-inputs/context.json
          cp -R "$run_root/release" "$run_root/directory" prepared-producer-inputs/
          cp "$run_root/release/release-manifest.json" "$run_root/release/checksums.txt" prepared-policy-inputs/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-node22-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            npm-observation.json
            npm-observation.SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-launch-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared-observer-context
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - id: identity
        run: echo "run_attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-producer-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared-producer-inputs
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-policy-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prepared-policy-inputs/release-manifest.json
            prepared-policy-inputs/checksums.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  aggregate-one-release:
    if: always() && inputs.consent && inputs.publication_id != '' && inputs.publication_sequence != '' && inputs.publication_snapshot_digest != '' && inputs.publication_source_commit != '' && inputs.publication_ledger_commit != '' && (inputs.caller_event_name == 'push' || inputs.caller_event_name == 'schedule' || inputs.caller_event_name == 'workflow_dispatch') && inputs.caller_ref == 'refs/heads/main' && inputs.caller_workflow_ref == format('{0}/.github/workflows/directory-publication.yml@refs/heads/main', github.repository)
    needs: [native-release, node22-npm-facade]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      evidence_run_attempt: ${{ steps.identity.outputs.run_attempt }}
    steps:
      - name: Validate the unmodified canonical publication sequence
        shell: bash
        env:
          PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
          LC_ALL: C
        run: |
          value="$PUBLICATION_SEQUENCE"
          case "$value" in ""|0*|*[!0-9]*) exit 1 ;; esac
          maximum=9007199254740991
          test "${#value}" -lt "${#maximum}" || { test "${#value}" -eq "${#maximum}" && test "$value" \< "$maximum" -o "$value" = "$maximum"; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "native-*-${{ github.run_id }}-${{ needs.native-release.outputs.evidence_run_attempt }}"
          path: native
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-node22-${{ github.run_id }}-${{ needs.node22-npm-facade.outputs.evidence_run_attempt }}
          path: npm
      - name: Require six native slots and one identical release manifest
        run: |
          test "$(find native -name native-observation.json | wc -l)" -eq 6
          find native -name native-observation.SHA256SUMS -execdir sha256sum --check native-observation.SHA256SUMS \;
          (cd npm && sha256sum --check npm-observation.SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          native=[json.loads(p.read_text()) for p in Path('native').rglob('native-observation.json')]
          npm=json.loads(Path('npm/npm-observation.json').read_text())
          config=json.loads(Path('tests/e2e/production-launch.json').read_text())
          expected={('macos','arm64'),('macos','amd64'),('linux','arm64'),('linux','amd64'),('windows','amd64'),('windows','arm64')}
          assert {(x['os'],x['architecture']) for x in native} == expected
          records=[*native,npm]
          assert {x['catalog_repository'] for x in records} == {config['catalog_repository']}
          assert {x['catalog_sha'] for x in records} == {'${{ github.sha }}'}
          assert {x['cli_release_repository'] for x in records} == {config['cli_release_repository']}
          assert {x['cli_release_tag'] for x in records} == {config['cli_release_tag']}
          assert len({json.dumps(x['github_release_identity'],sort_keys=True) for x in records}) == 1
          release_identity=native[0]['github_release_identity']
          assert release_identity['repository'] == config['cli_release_repository']
          assert release_identity['tag'] == config['cli_release_tag'] and release_identity['immutable'] is True
          expected_assets={
              'agentplugins_0.1.18_darwin_arm64','agentplugins_0.1.18_darwin_amd64',
              'agentplugins_0.1.18_linux_arm64','agentplugins_0.1.18_linux_amd64',
              'agentplugins_0.1.18_windows_arm64.exe','agentplugins_0.1.18_windows_amd64.exe',
          }
          attestations=[x['github_asset_attestation'] for x in native]
          assert {x['asset_name'] for x in attestations} == expected_assets
          expected_attestation_keys={'repository','workflow','tag','tag_commit','issuer','source_ref','source_digest','predicate_type','subject_name','subject_digest','runner_environment','asset_name','asset_digest','verified'}
          assert all(set(x) == expected_attestation_keys for x in attestations)
          assert all(x['verified'] is True and x['repository'] == config['cli_release_repository'] and x['workflow'] == config['cli_release_workflow'] and x['tag'] == config['cli_release_tag'] and x['tag_commit'] == release_identity['tag_commit'] and x['issuer'] == 'https://token.actions.githubusercontent.com' and x['source_ref'] == 'refs/heads/main' and x['source_digest'] == release_identity['tag_commit'] and x['predicate_type'] == 'https://slsa.dev/provenance/v1' and x['runner_environment'] == 'github-hosted' for x in attestations)
          assert all(x['github_asset_attestation']['asset_name'] == x['asset_name'] and x['github_asset_attestation']['asset_digest'] == x['asset_digest'] and x['github_asset_attestation']['subject_name'] == x['asset_name'] and x['github_asset_attestation']['subject_digest'] == x['asset_digest'] for x in native)
          assert len({x['release_manifest_digest'] for x in records}) == 1
          assert len({x['release_checksums_digest'] for x in records}) == 1
          assert len({x['directory_digest'] for x in records}) == 1
          PY
      - id: identity
        env:
          NATIVE_ATTEMPT: ${{ needs.native-release.outputs.evidence_run_attempt }}
          NODE_ATTEMPT: ${{ needs.node22-npm-facade.outputs.evidence_run_attempt }}
        run: |
          test -n "$NATIVE_ATTEMPT" && test -n "$NODE_ATTEMPT"
          echo "run_attempt=${NODE_ATTEMPT}" >> "$GITHUB_OUTPUT"

  source-policy-conformance:
    needs: [validate-publication-sequence, node22-npm-facade]
    if: inputs.consent && inputs.publication_id != '' && inputs.publication_sequence != '' && inputs.publication_snapshot_digest != '' && inputs.publication_source_commit != '' && inputs.publication_ledger_commit != '' && (inputs.caller_event_name == 'push' || inputs.caller_event_name == 'schedule' || inputs.caller_event_name == 'workflow_dispatch') && inputs.caller_ref == 'refs/heads/main' && inputs.caller_workflow_ref == format('{0}/.github/workflows/directory-publication.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.policy.outputs.artifact_name }}
      evidence_digest: ${{ steps.policy.outputs.evidence_digest }}
    steps:
      - name: Validate the unmodified canonical publication sequence
        shell: bash
        env:
          PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
          LC_ALL: C
        run: |
          value="$PUBLICATION_SEQUENCE"
          case "$value" in ""|0*|*[!0-9]*) exit 1 ;; esac
          maximum=9007199254740991
          test "${#value}" -lt "${#maximum}" || { test "${#value}" -eq "${#maximum}" && test "$value" \< "$maximum" -o "$value" = "$maximum"; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 777genius/plugin-kit-ai
          ref: 74a3790ee15d92afda8e8e3dd8f903c04811cfc7
          path: _plugin-kit-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with: {go-version: '1.25.13', cache: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - run: python -m pip install check-jsonschema==0.37.4
