name: Catalog publication readiness (no account runtime)

on:
  workflow_call:
    inputs:
      publication_id: {required: true, type: string}
      sequence: {required: true, type: string}
      snapshot_digest: {required: true, type: string}
      source_sha: {required: true, type: string}
      workflow_sha: {required: true, type: string}
      signed_ledger_sha: {required: true, type: string}
      materialized_ledger_sha: {required: true, type: string}
      baseline_ledger_sha: {required: true, type: string}
    outputs:
      run_attempt:
        description: Current attempt, emitted only after exact attestation verification
        value: ${{ jobs.verify.outputs.run_attempt }}

permissions:
  contents: read

env:
  PUBLICATION_ID: ${{ inputs.publication_id }}
  PUBLICATION_SEQUENCE: ${{ inputs.sequence }}
  SNAPSHOT_DIGEST: ${{ inputs.snapshot_digest }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  WORKFLOW_SHA: ${{ inputs.workflow_sha }}
  SIGNED_LEDGER_SHA: ${{ inputs.signed_ledger_sha }}
  MATERIALIZED_LEDGER_SHA: ${{ inputs.materialized_ledger_sha }}
  BASELINE_LEDGER_SHA: ${{ inputs.baseline_ledger_sha }}
  AGENTPLUGINS_VERSION: "0.1.25"
  AGENTPLUGINS_COMMIT: d168b28bcdeef0c558bee3935adab25abb9f6267
  CLAUDE_CODE_VERSION: "2.1.251"
  CLAUDE_CODE_NPM_INTEGRITY: sha512-eG+ZPPpW2Dbmnntf1Fz9/T9ewS8I8SKfc1tcU2PqSwmftfjRPP7BXPaCyLuZ8kvgTdiPnJi/2/JnTvTRieneEQ==
  COPILOT_VERSION: "1.0.82"
  COPILOT_NPM_INTEGRITY: sha512-+mDIwBO3dCpL3k2rVLc4+1tFzqcVBTJNA/0co+okEpmCgcHjaz91Cqq7++pJKN5yJQuGC6bKangm7PSoheI1Xw==
  INSPECTOR_VERSION: "2.1.0"
  INSPECTOR_NPM_INTEGRITY: sha512-Fp3kvgW5W6tcttErlYKy9iud6nE1oKUUB+qpFgh+ImfvYDJDgtGtx7IHJ+E6K1rXAerr9HQvYQenWrGP8lAqPQ==

jobs:
  produce:
    name: Credential-free catalog lifecycle and mandatory eleven source-policy cases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.workflow_sha }}
          persist-credentials: false
      - name: Require the exact main publication caller
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          test "$GITHUB_REPOSITORY" = 777genius/universal-agent-plugins
          test "$GITHUB_REF" = refs/heads/main
          test "$WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$CALLER_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/directory-publication.yml@refs/heads/main"
          case "$GITHUB_EVENT_NAME" in push|schedule|workflow_dispatch) ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.materialized_ledger_sha }}
          path: staged
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline_ledger_sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 777genius/plugin-kit-ai
          ref: d168b28bcdeef0c558bee3935adab25abb9f6267
          path: _plugin-kit-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "24.20.0"}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with: {go-version: "1.25.13", cache: false}
      - run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0
      - name: Install the current stable Ubuntu bubblewrap package and record namespace policy
        run: |
          test "$RUNNER_OS" = Linux
          sudo apt-get update
          candidate="$(apt-cache policy bubblewrap | awk '$1 == "Candidate:" {print $2}')"
          test -n "$candidate"
          test "$candidate" != '(none)'
          sudo apt-get install --yes --no-install-recommends "bubblewrap=$candidate"
          test "$(dpkg-query -W -f='${Version}' bubblewrap)" = "$candidate"
          /usr/bin/bwrap --version
          uname -r
          for setting in /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/user/max_user_namespaces; do
            if test -r "$setting"; then printf '%s=' "$setting"; cat "$setting"; fi
          done
      - name: Allow user namespaces only for the root-owned bubblewrap executable
        id: isolation_profile
        run: |
          test "$RUNNER_OS" = Linux
          test "$GITHUB_ACTIONS" = true
          test -f /usr/bin/bwrap
          test ! -L /usr/bin/bwrap
          test "$(stat -c '%U:%G:%a' /usr/bin/bwrap)" = root:root:755
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          profile=/etc/apparmor.d/uap-catalog-bwrap
          test ! -e "$profile"
          test ! -L "$profile"
          if sudo grep -R -q -F /usr/bin/bwrap /etc/apparmor.d; then
            echo "An existing bubblewrap AppArmor policy requires review" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          if sudo grep -q '^uap-catalog-bwrap ' /sys/kernel/security/apparmor/profiles; then
            echo "The catalog AppArmor profile is already loaded" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          sudo /usr/sbin/apparmor_parser --skip-kernel-load --skip-cache tests/e2e/catalog-bwrap.apparmor
          echo "profile_owned=true" >> "$GITHUB_OUTPUT"
          sudo install -o root -g root -m 0644 tests/e2e/catalog-bwrap.apparmor "$profile"
          test "$(stat -c '%U:%G:%a' "$profile")" = root:root:644
          sudo /usr/sbin/apparmor_parser --add --skip-cache "$profile"
      - name: Require Linux child confinement before any untrusted execution
        run: python3 -m unittest tests.test_catalog_process_isolation -v
      - name: Download and authenticate the exact released CLI before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "agentplugins-v${AGENTPLUGINS_VERSION}" \
            --repo 777genius/plugin-kit-ai \
            --pattern "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64" \
            --pattern checksums.txt --pattern release-manifest.json \
            --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          test "$(sha256sum agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64 | cut -d ' ' -f 1)" = 83f7785383a47b82523ff610893df51ee979d6f444f7de6723b07fbc80cec2e4
          test "$(sha256sum checksums.txt | cut -d ' ' -f 1)" = af3b08a34fcf8a24c307ffb252cc5144edadbc6be3345ef2e008caef7e471f85
          test "$(sha256sum release-manifest.json | cut -d ' ' -f 1)" = 26a99c47b6571bd3af52124529e2d57f983e6690c5082dbaae47f955259a20be
          sha256sum --check checksums.txt --ignore-missing
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path("release-manifest.json").read_text())
          asset = manifest["assets"]["linux-amd64"]
          assert manifest["schema_version"] == 2
          assert manifest["tag"] == f"agentplugins-v{os.environ['AGENTPLUGINS_VERSION']}"
          assert manifest["version"] == os.environ["AGENTPLUGINS_VERSION"]
          assert manifest["commit"] == os.environ["AGENTPLUGINS_COMMIT"]
          assert asset["file"] == f"agentplugins_{os.environ['AGENTPLUGINS_VERSION']}_linux_amd64"
          binary = Path(asset["file"])
          assert asset["size"] == binary.stat().st_size
          assert asset["sha256"] == hashlib.sha256(binary.read_bytes()).hexdigest()
          PY
          for asset in "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64" checksums.txt release-manifest.json; do
            gh attestation verify "$asset" --repo 777genius/plugin-kit-ai \
              --signer-workflow 777genius/plugin-kit-ai/.github/workflows/agentplugins-release.yml \
              --source-digest "$AGENTPLUGINS_COMMIT" --deny-self-hosted-runners
          done
          chmod +x "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64"
      - name: Install exact public clients without account credentials
        env:
          TOOLS_ROOT: ${{ runner.temp }}/catalog-tools
        run: |
          test "$(npm view "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" dist.integrity)" = "$CLAUDE_CODE_NPM_INTEGRITY"
          test "$(npm view "@github/copilot@${COPILOT_VERSION}" dist.integrity)" = "$COPILOT_NPM_INTEGRITY"
          test "$(npm view "@modelcontextprotocol/inspector@${INSPECTOR_VERSION}" dist.integrity)" = "$INSPECTOR_NPM_INTEGRITY"
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from catalog_process_isolation import run_isolated
          root = Path(os.environ["TOOLS_ROOT"]).resolve()
          root.mkdir(mode=0o700)
          for name in ("home", "tmp", "npm-cache"):
              (root / name).mkdir(mode=0o700)
          env = {
              "PATH": os.environ["PATH"], "LANG": "C.UTF-8", "CI": "true",
              "HOME": str(root / "home"), "USERPROFILE": str(root / "home"),
              "TMPDIR": str(root / "tmp"), "NPM_CONFIG_CACHE": str(root / "npm-cache"),
              "NPM_CONFIG_USERCONFIG": str(root / "home/.npmrc"),
              "NPM_CONFIG_GLOBALCONFIG": str(root / "home/global.npmrc"),
              "GIT_CONFIG_GLOBAL": str(root / "home/.gitconfig"),
              "GIT_CONFIG_NOSYSTEM": "1", "GIT_TERMINAL_PROMPT": "0",
          }
          packages = {
              "@anthropic-ai/claude-code": os.environ["CLAUDE_CODE_VERSION"],
              "@github/copilot": os.environ["COPILOT_VERSION"],
              "@modelcontextprotocol/inspector": os.environ["INSPECTOR_VERSION"],
          }
          npm = str(Path(shutil.which("npm")).resolve(strict=True))
          node_root = Path(shutil.which("node")).resolve(strict=True).parent.parent
          commands = (
              [npm, "install", "--prefix", str(root), "--no-audit", "--no-fund", *[f"{name}@{version}" for name, version in packages.items()]],
              [npm, "audit", "signatures", "--prefix", str(root)],
          )
          for command in commands:
              result = run_isolated(command, writable_root=root.resolve(), cwd=root.resolve(),
                                    env=env, read_only_paths=(node_root,), timeout=600)
              print(result.stdout)
              print(result.stderr, file=sys.stderr)
              result.check_returncode()
          for name, version in packages.items():
              assert json.loads((root / "node_modules" / name / "package.json").read_text())["version"] == version
          PY
      - name: Require all eleven exact-source policy cases
        run: |
          test "$(git -C _plugin-kit-source rev-parse HEAD)" = "$AGENTPLUGINS_COMMIT"
          test "$(git -C _plugin-kit-source describe --tags --exact-match HEAD)" = "agentplugins-v${AGENTPLUGINS_VERSION}"
          python3 scripts/run_source_policy_conformance.py \
            --source _plugin-kit-source --schema-version 2 \
            --release-manifest "$RUNNER_TEMP/release/release-manifest.json" \
            --release-checksums "$RUNNER_TEMP/release/checksums.txt" \
            --uap-sha "$WORKFLOW_SHA" --output evidence/source-policy-conformance.json
      - name: Prove the exact catalog matrix in fresh credential-free roots
        run: |
          test "$(git -C staged rev-parse HEAD)" = "$MATERIALIZED_LEDGER_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_LEDGER_SHA"
          python3 scripts/catalog_publication_readiness.py produce \
            --feed staged/registry/schemas/1 --trusted-keys registry/publication/trusted-keys.json \
            --baseline-feed baseline/registry/schemas/1 \
            --directory-origin "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${MATERIALIZED_LEDGER_SHA}/registry/schemas/1/" \
            --binary "$RUNNER_TEMP/release/agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64" \
            --claude "$RUNNER_TEMP/catalog-tools/node_modules/.bin/claude" \
            --copilot "$RUNNER_TEMP/catalog-tools/node_modules/.bin/copilot" --npx "$(command -v npx)" \
            --inspector "$RUNNER_TEMP/catalog-tools/node_modules/.bin/mcp-inspector" \
            --publication-id "$PUBLICATION_ID" --sequence "$PUBLICATION_SEQUENCE" \
            --snapshot-digest "$SNAPSHOT_DIGEST" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" \
            --signed-ledger-sha "$SIGNED_LEDGER_SHA" --materialized-ledger-sha "$MATERIALIZED_LEDGER_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" \
            --sandbox "$RUNNER_TEMP/catalog-sandbox" --output evidence/catalog-readiness.json
      - name: Preserve bounded sanitized failure diagnostics only
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/catalog-readiness-failure.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-readiness-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/catalog-readiness.json
            evidence/source-policy-conformance.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Remove only this job's ephemeral AppArmor allowance
        if: ${{ always() && steps.isolation_profile.outputs.profile_owned == 'true' }}
        run: |
          profile=/etc/apparmor.d/uap-catalog-bwrap
          if test ! -e "$profile" && test ! -L "$profile"; then exit 0; fi
          test -f "$profile"
          test ! -L "$profile"
          status=0
          sudo /usr/sbin/apparmor_parser --remove --skip-cache "$profile" || status=$?
          sudo rm -- "$profile"
          exit "$status"

  attest:
    name: Validate canonical data in a fresh job, then attest only those bytes
    needs: produce
    if: ${{ needs.produce.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.materialized_ledger_sha }}
          path: staged
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline_ledger_sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-readiness-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Strictly validate both canonical subjects without executing clients or MCP
        run: |
          test "$WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/catalog_publication_readiness.py verify \
            --feed staged/registry/schemas/1 --trusted-keys registry/publication/trusted-keys.json \
            --baseline-feed baseline/registry/schemas/1 \
            --directory-origin "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${MATERIALIZED_LEDGER_SHA}/registry/schemas/1/" \
            --publication-id "$PUBLICATION_ID" --sequence "$PUBLICATION_SEQUENCE" \
            --snapshot-digest "$SNAPSHOT_DIGEST" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" \
            --signed-ledger-sha "$SIGNED_LEDGER_SHA" --materialized-ledger-sha "$MATERIALIZED_LEDGER_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" \
            --artifact evidence/catalog-readiness.json
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from two_lane_evidence import canonical_json, sha256_file, validate_source_policy_evidence
          path = Path("evidence/source-policy-conformance.json")
          assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 1048576
          body = path.read_bytes()
          value = json.loads(body)
          assert body == canonical_json(value)
          validate_source_policy_evidence(value, expected_schema_version=2, uap_sha=os.environ["WORKFLOW_SHA"],
              scenario_digest=sha256_file(Path("tests/e2e/launch-scenarios.json")),
              harness_digest=sha256_file(Path("tests/e2e/source-policy-tests.json")),
              overlay_digest=sha256_file(Path("tests/e2e/source-policy-overlay.json")))
          assert {p.name for p in Path("evidence").iterdir()} == {"catalog-readiness.json", "source-policy-conformance.json"}
          PY
      - name: Attest only the validated catalog and policy subjects
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            evidence/catalog-readiness.json
            evidence/source-policy-conformance.json
      - name: Preserve exact offline attestation transport
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          test -f "$BUNDLE_PATH" && test ! -L "$BUNDLE_PATH"
          mkdir attestation
          cp -- "$BUNDLE_PATH" attestation/github-attestation.jsonl
          test -s attestation/github-attestation.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-attestation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: attestation/github-attestation.jsonl
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  verify:
    name: Gate exact current-run catalog and policy provenance
    needs: [produce, attest]
    if: ${{ always() && needs.produce.result == 'success' && needs.attest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      attestations: read
    outputs:
      run_attempt: ${{ steps.gate.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.materialized_ledger_sha }}
          path: staged
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline_ledger_sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-readiness-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-attestation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: attestation
      - name: Verify authenticated subjects, exact workflow source, and current run attempt
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/catalog_publication_readiness.py verify \
            --feed staged/registry/schemas/1 --trusted-keys registry/publication/trusted-keys.json \
            --baseline-feed baseline/registry/schemas/1 \
            --directory-origin "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${MATERIALIZED_LEDGER_SHA}/registry/schemas/1/" \
            --publication-id "$PUBLICATION_ID" --sequence "$PUBLICATION_SEQUENCE" \
            --snapshot-digest "$SNAPSHOT_DIGEST" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" \
            --signed-ledger-sha "$SIGNED_LEDGER_SHA" --materialized-ledger-sha "$MATERIALIZED_LEDGER_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" \
            --artifact evidence/catalog-readiness.json
          for subject in catalog-readiness.json source-policy-conformance.json; do
            gh attestation verify "evidence/$subject" --bundle attestation/github-attestation.jsonl \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/catalog-publication-readiness.yml" \
              --signer-digest "$WORKFLOW_SHA" --source-ref refs/heads/main --source-digest "$WORKFLOW_SHA" \
              --deny-self-hosted-runners --format json > "$RUNNER_TEMP/$subject.verified.json"
          done
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from two_lane_evidence import canonical_json, sha256_file, validate_source_policy_evidence
          policy_path = Path("evidence/source-policy-conformance.json")
          assert policy_path.is_file() and not policy_path.is_symlink() and policy_path.stat().st_size <= 1048576
          policy = json.loads(policy_path.read_bytes())
          assert policy_path.read_bytes() == canonical_json(policy)
          validate_source_policy_evidence(policy, expected_schema_version=2, uap_sha=os.environ["WORKFLOW_SHA"],
              scenario_digest=sha256_file(Path("tests/e2e/launch-scenarios.json")),
              harness_digest=sha256_file(Path("tests/e2e/source-policy-tests.json")),
              overlay_digest=sha256_file(Path("tests/e2e/source-policy-overlay.json")))
          invocation = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
          for subject in ("catalog-readiness.json", "source-policy-conformance.json"):
              verified = json.loads((Path(os.environ["RUNNER_TEMP"]) / f"{subject}.verified.json").read_text())
              assert isinstance(verified, list) and len(verified) == 1
              certificate = verified[0]["verificationResult"]["signature"]["certificate"]
              assert certificate["runInvocationURI"] == invocation
              assert certificate["buildConfigURI"] == f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/.github/workflows/directory-publication.yml@refs/heads/main"
              statement = verified[0]["verificationResult"]["statement"]
              assert statement["predicateType"] == "https://slsa.dev/provenance/v1"
              assert statement["predicate"]["runDetails"]["metadata"]["invocationId"] == invocation
          PY
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
