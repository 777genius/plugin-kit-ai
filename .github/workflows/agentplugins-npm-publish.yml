name: Agentplugins NPM Provenance Bootstrap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable stable release tag
        required: true
      bootstrap_publish:
        description: Compatibility input; this diagnostic workflow never publishes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned npm with provenance support
        run: npm install --global npm@12.0.2
      - name: Validate immutable stable release
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^agentplugins-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid agentplugins stable tag: ${TAG}" >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main
          head_commit="$(git rev-parse HEAD)"
          test "${head_commit}" = "$(git rev-parse refs/remotes/origin/main)"
          test "${head_commit}" = "$(git rev-list -n 1 "${TAG}")"
          echo "commit=${head_commit}" >> "${GITHUB_OUTPUT}"
          package_name="$(node -p 'require("./npm/agentplugins/package.json").name')"
          package_name_length="$(printf '%s' "${package_name}" | wc -c | tr -d ' ')"
          if [[ ! "${package_name}" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || [[ "${package_name_length}" -gt 214 ]]; then
            echo "invalid unscoped npm package name" >&2
            exit 1
          fi
          test "$(node -p 'require("./npm/agentplugins/package.json").bin.agentplugins')" = "bin/agentplugins.js"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
      - name: Download and verify all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "${RUNNER_TEMP}/agentplugins-assets"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/agentplugins-assets"
          cd "${RUNNER_TEMP}/agentplugins-assets"
          test "$(find . -maxdepth 1 -type f -name 'agentplugins_*' | wc -l | tr -d ' ')" = 6
          sha256sum --check checksums.txt
          test "$(jq -r '.schema_version' release-manifest.json)" = 1
          test "$(jq -r '.tag' release-manifest.json)" = "${TAG}"
          test "$(jq -r '.commit' release-manifest.json)" = "${{ steps.release.outputs.commit }}"
          for asset in agentplugins_* checksums.txt release-manifest.json; do
            gh attestation verify "${asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/agentplugins-release.yml" \
              --source-digest "${{ steps.release.outputs.commit }}"
          done
      - name: Stage exact npm package with embedded platform hashes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#agentplugins-v}"
          stage="${RUNNER_TEMP}/agentplugins-npm"
          mkdir -p "${stage}"
          cp -R npm/agentplugins/. "${stage}/"
          node npm/agentplugins/scripts/stage-release.js "${stage}" "${RUNNER_TEMP}/agentplugins-assets" "${version}"
          cd "${stage}"
          npm test
          npm pack --dry-run --ignore-scripts
          AGENTPLUGINS_CACHE_DIR="${RUNNER_TEMP}/agentplugins-cache" node bin/agentplugins.js version | grep -Fx "agentplugins ${version}"
      - name: Pack exact tarball and generate signed provenance
        env:
          TAG: ${{ inputs.tag }}
          NPM_PACKAGE: ${{ steps.release.outputs.package_name }}
          SOURCE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          version="${TAG#agentplugins-v}"
          artifact="${RUNNER_TEMP}/agentplugins-provenance"
          mkdir -p "${artifact}"
          cd "${RUNNER_TEMP}/agentplugins-npm"
          tarball_name="$(npm pack --json --ignore-scripts | jq -r '.[0].filename')"
          tarball="${artifact}/${tarball_name}"
          mv "${tarball_name}" "${tarball}"
          bundle="${artifact}/${tarball_name}.sigstore"
          export NPM_ROOT="$(npm root --global)"
          export GITHUB_SHA="${SOURCE_COMMIT}"
          export GITHUB_REF="refs/tags/${TAG}"
          node - "${tarball}" "${bundle}" "${NPM_PACKAGE}" "${version}" <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs/promises')
          const path = require('node:path')

          const [tarballPath, bundlePath, packageName, packageVersion] = process.argv.slice(2)
          const provenanceModule = path.join(
            process.env.NPM_ROOT,
            'npm/node_modules/libnpmpublish/lib/provenance.js'
          )
          const { generateProvenance, verifyProvenance } = require(provenanceModule)

          const run = async () => {
            const tarball = await fs.readFile(tarballPath)
            const subject = {
              name: `pkg:npm/${packageName}@${packageVersion}`,
              digest: { sha512: crypto.createHash('sha512').update(tarball).digest('hex') },
            }
            const bundle = await generateProvenance([subject], {})
            await fs.writeFile(bundlePath, `${JSON.stringify(bundle)}\n`, { mode: 0o600 })
            await verifyProvenance(subject, bundlePath)
            const statement = JSON.parse(
              Buffer.from(bundle.dsseEnvelope.payload, 'base64').toString('utf8')
            )
            await fs.writeFile(
              `${bundlePath}.statement.json`,
              `${JSON.stringify(statement, null, 2)}\n`
            )
          }

          run().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
          statement="${bundle}.statement.json"
          test "$(jq -r '.subject[0].name' "${statement}")" = "pkg:npm/${NPM_PACKAGE}@${version}"
          test "$(jq -r '.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit' "${statement}")" = "${SOURCE_COMMIT}"
          test "$(jq -r '.predicate.buildDefinition.resolvedDependencies[0].uri' "${statement}")" = "git+https://github.com/${GITHUB_REPOSITORY}@refs/tags/${TAG}"
          sha1sum "${tarball}" > "${artifact}/SHA1SUMS"
          sha512sum "${tarball}" > "${artifact}/SHA512SUMS"
          printf 'source_commit=%s\nsource_ref=refs/tags/%s\nworkflow_run=%s\n' \
            "${SOURCE_COMMIT}" "${TAG}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${artifact}/manifest.txt"
      - name: Upload exact tarball and signed provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: universal-agent-plugins-provenance
          path: ${{ runner.temp }}/agentplugins-provenance
          if-no-files-found: error
          retention-days: 1
