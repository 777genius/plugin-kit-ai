name: live MCP E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-read-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: python3 scripts/run_mcp_e2e.py --profile ci --output /tmp/universal-agent-plugins-e2e.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: live-e2e-evidence
          path: /tmp/universal-agent-plugins-e2e.json
