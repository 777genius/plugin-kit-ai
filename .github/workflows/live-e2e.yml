name: live E2E read-only checks

on:
  workflow_call:
    inputs:
      consent:
        required: true
        type: boolean
      publication_id:
        required: true
        type: string
      publication_sequence:
        required: true
        type: number
      publication_snapshot_digest:
        required: true
        type: string
      publication_source_commit:
        required: true
        type: string
      publication_ledger_commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      consent:
        description: Approve disposable live launch checks
        required: true
        type: boolean
      publication_id:
        description: Exact signed snapshot publication_id to verify
        required: true
        type: string
      publication_sequence:
        description: Exact staged snapshot sequence to verify
        required: true
        type: number
      publication_snapshot_digest:
        description: Exact sha256 digest of the staged snapshot bytes
        required: true
        type: string
      publication_source_commit:
        description: Exact 40-hex source commit embedded in the staged snapshot
        required: true
        type: string
      publication_ledger_commit:
        description: Exact 40-hex materialized ledger commit containing the staged bytes
        required: true
        type: string
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: live-e2e-read-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  required-stable-launch-evidence:
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/launch-evidence-e2e.yml
    with:
      consent: ${{ inputs.consent }}
      publication_id: ${{ inputs.publication_id }}
      publication_sequence: ${{ inputs.publication_sequence }}
      publication_snapshot_digest: ${{ inputs.publication_snapshot_digest }}
      publication_source_commit: ${{ inputs.publication_source_commit }}
      publication_ledger_commit: ${{ inputs.publication_ledger_commit }}
    permissions:
      actions: read
      contents: read
      id-token: write

  public-read-flows:
    if: github.event_name == 'schedule' || inputs.consent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run credential-free public MCP reads
        run: python scripts/run_mcp_e2e.py --profile ci --output /tmp/public-mcp-evidence.json
      - run: (cd /tmp && sha256sum public-mcp-evidence.json > public-mcp-evidence.SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-read-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/public-mcp-evidence.json
            /tmp/public-mcp-evidence.SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  scheduled-fixture-contract:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate fixture-only non-runtime harness
        run: |
          run_root="/tmp/uap-live-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/run_launch_evidence_e2e.py --mode fixture-only \
            --consent tests/e2e/fixtures/fixture-only-consent.json \
            --run-root "$run_root" \
            --output "$run_root/evidence/launch-evidence.json"
          python -m unittest tests.test_run_launch_evidence_e2e tests.test_workflow_contracts

  scheduled-production-directory-observation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Observe the current signed production identity without runtime claims
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from scripts.run_launch_evidence_e2e import fetch_production_directory, read_production_config

          config = read_production_config()
          with tempfile.TemporaryDirectory(prefix="uap-scheduled-production-") as tmp:
              environment, snapshot, digest = fetch_production_directory(Path(tmp) / "directory")
          if environment["AGENTPLUGINS_DIRECTORY_ORIGIN"] != config["production_origin"]:
              raise ValueError("production observation resolved an unexpected origin")
          observation = {
              "schema_version": 1,
              "origin": environment["AGENTPLUGINS_DIRECTORY_ORIGIN"],
              "publication_id": snapshot["publication_id"],
              "sequence": snapshot["sequence"],
              "snapshot_digest": digest,
              "source_commit": snapshot["source_commit"],
              "runtime_claims": False,
              "oauth_claims": False,
          }
          Path("/tmp/scheduled-production-directory.json").write_text(
              json.dumps(observation, indent=2, sort_keys=True) + "\n"
          )
          PY
          (cd /tmp && sha256sum scheduled-production-directory.json > scheduled-production-directory.SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-production-directory-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/scheduled-production-directory.json
            /tmp/scheduled-production-directory.SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          overwrite: false
