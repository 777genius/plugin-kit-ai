name: live E2E read-only checks

on:
  workflow_call:
    inputs:
      consent:
        required: true
        type: boolean
      publication_id:
        required: true
        type: string
      publication_sequence:
        required: true
        type: string
      publication_snapshot_digest:
        required: true
        type: string
      publication_source_commit:
        required: true
        type: string
      publication_ledger_commit:
        required: true
        type: string
      caller_event_name:
        required: true
        type: string
      caller_ref:
        required: true
        type: string
      caller_workflow_ref:
        required: true
        type: string
    outputs:
      evidence_artifact_name:
        description: Exact stable-launch Actions transport artifact
        value: ${{ jobs.required-live-e2e.outputs.evidence_artifact_name }}
      launch_evidence_digest:
        description: SHA-256 of canonical launch-evidence.json
        value: ${{ jobs.required-live-e2e.outputs.launch_evidence_digest }}
      workflow_source_digest:
        description: Exact protected launch workflow source commit
        value: ${{ jobs.required-live-e2e.outputs.workflow_source_digest }}
      evidence_run_attempt:
        description: Exact attempt that produced the immutable evidence artifact
        value: ${{ jobs.required-live-e2e.outputs.evidence_run_attempt }}
      attestation_artifact_name:
        description: Exact offline GitHub provenance transport artifact
        value: ${{ jobs.required-live-e2e.outputs.attestation_artifact_name }}
      source_policy_artifact_name:
        description: Exact source-policy conformance artifact
        value: ${{ jobs.required-live-e2e.outputs.source_policy_artifact_name }}
      source_policy_evidence_digest:
        description: SHA-256 of canonical source-policy evidence
        value: ${{ jobs.required-live-e2e.outputs.source_policy_evidence_digest }}
      readiness_artifact_name:
        description: Exact two-lane readiness artifact
        value: ${{ jobs.required-live-e2e.outputs.readiness_artifact_name }}
      readiness_evidence_digest:
        description: SHA-256 of canonical readiness envelope
        value: ${{ jobs.required-live-e2e.outputs.readiness_evidence_digest }}
  workflow_dispatch:
    inputs:
      run_scheduled_regression:
        description: Run the credential-free scheduled regression jobs now
        required: false
        default: false
        type: boolean
      consent:
        description: Approve disposable live launch checks
        required: true
        type: boolean
      publication_id:
        description: Exact signed snapshot publication_id to verify
        required: true
        type: string
      publication_sequence:
        description: Exact staged snapshot sequence to verify
        required: true
        type: string
      publication_snapshot_digest:
        description: Exact sha256 digest of the staged snapshot bytes
        required: true
        type: string
      publication_source_commit:
        description: Exact 40-hex source commit embedded in the staged snapshot
        required: true
        type: string
      publication_ledger_commit:
        description: Exact 40-hex materialized ledger commit containing the staged bytes
        required: true
        type: string
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: live-e2e-read-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-publication-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Validate the unmodified canonical publication sequence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
          LC_ALL: C
        run: |
          if test "$EVENT_NAME" = schedule; then
            exit 0
          fi
          value="$PUBLICATION_SEQUENCE"
          case "$value" in ""|0*|*[!0-9]*) exit 1 ;; esac
          maximum=9007199254740991
          test "${#value}" -lt "${#maximum}" || { test "${#value}" -eq "${#maximum}" && test "$value" \< "$maximum" -o "$value" = "$maximum"; }

  required-stable-launch-evidence:
    needs: [validate-publication-sequence]
    if: inputs.consent && inputs.publication_id != '' && inputs.publication_sequence != '' && inputs.publication_snapshot_digest != '' && inputs.publication_source_commit != '' && inputs.publication_ledger_commit != '' && (inputs.caller_event_name == 'push' || inputs.caller_event_name == 'schedule' || inputs.caller_event_name == 'workflow_dispatch') && inputs.caller_ref == 'refs/heads/main' && inputs.caller_workflow_ref == format('{0}/.github/workflows/directory-publication.yml@refs/heads/main', github.repository)
    uses: ./.github/workflows/launch-evidence-e2e.yml
    with:
      consent: ${{ inputs.consent }}
      publication_id: ${{ inputs.publication_id }}
      publication_sequence: ${{ inputs.publication_sequence }}
      publication_snapshot_digest: ${{ inputs.publication_snapshot_digest }}
      publication_source_commit: ${{ inputs.publication_source_commit }}
      publication_ledger_commit: ${{ inputs.publication_ledger_commit }}
      caller_event_name: ${{ inputs.caller_event_name }}
      caller_ref: ${{ inputs.caller_ref }}
      caller_workflow_ref: ${{ inputs.caller_workflow_ref }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

  public-read-flows:
    needs: [validate-publication-sequence]
    if: github.event_name == 'schedule' || inputs.consent || inputs.run_scheduled_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run credential-free public MCP reads
        run: python scripts/run_mcp_e2e.py --profile ci --output /tmp/public-mcp-evidence.json
      - run: (cd /tmp && sha256sum public-mcp-evidence.json > public-mcp-evidence.SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-read-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/public-mcp-evidence.json
            /tmp/public-mcp-evidence.SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  required-live-e2e:
    name: Require complete live E2E results
    if: always() && needs.validate-publication-sequence.result == 'success' && inputs.consent && inputs.publication_id != '' && inputs.publication_sequence != '' && inputs.publication_snapshot_digest != '' && inputs.publication_source_commit != '' && inputs.publication_ledger_commit != '' && (inputs.caller_event_name == 'push' || inputs.caller_event_name == 'schedule' || inputs.caller_event_name == 'workflow_dispatch') && inputs.caller_ref == 'refs/heads/main' && inputs.caller_workflow_ref == format('{0}/.github/workflows/directory-publication.yml@refs/heads/main', github.repository)
    needs:
      - validate-publication-sequence
      - required-stable-launch-evidence
      - public-read-flows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      evidence_artifact_name: ${{ needs.required-stable-launch-evidence.outputs.evidence_artifact_name }}
      launch_evidence_digest: ${{ needs.required-stable-launch-evidence.outputs.launch_evidence_digest }}
      workflow_source_digest: ${{ needs.required-stable-launch-evidence.outputs.workflow_source_digest }}
      evidence_run_attempt: ${{ needs.required-stable-launch-evidence.outputs.evidence_run_attempt }}
      attestation_artifact_name: ${{ needs.required-stable-launch-evidence.outputs.attestation_artifact_name }}
      source_policy_artifact_name: ${{ needs.required-stable-launch-evidence.outputs.source_policy_artifact_name }}
      source_policy_evidence_digest: ${{ needs.required-stable-launch-evidence.outputs.source_policy_evidence_digest }}
      readiness_artifact_name: ${{ needs.required-stable-launch-evidence.outputs.readiness_artifact_name }}
      readiness_evidence_digest: ${{ needs.required-stable-launch-evidence.outputs.readiness_evidence_digest }}
    steps:
      - name: Reject skipped or failed nested evidence
        env:
          STABLE_E2E_RESULT: ${{ needs.required-stable-launch-evidence.result }}
          PUBLIC_READ_RESULT: ${{ needs.public-read-flows.result }}
          READINESS_DIGEST: ${{ needs.required-stable-launch-evidence.outputs.readiness_evidence_digest }}
          POLICY_DIGEST: ${{ needs.required-stable-launch-evidence.outputs.source_policy_evidence_digest }}
        run: |
          test "$STABLE_E2E_RESULT" = success
          test "$PUBLIC_READ_RESULT" = success
          case "$READINESS_DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          case "$POLICY_DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac

  scheduled-fixture-contract:
    needs: [validate-publication-sequence]
    if: github.event_name == 'schedule' || inputs.run_scheduled_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned launch harness dependencies
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - name: Validate fixture-only non-runtime harness
        run: |
          run_root="/tmp/uap-live-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/run_launch_evidence_e2e.py --mode fixture-only \
            --uap-sha "$GITHUB_SHA" \
            --consent tests/e2e/fixtures/fixture-only-consent.json \
            --run-root "$run_root" \
            --output "$run_root/evidence/launch-evidence.json"
          python -m unittest tests.test_run_launch_evidence_e2e tests.test_materialize_launch_evidence tests.test_workflow_contracts

  scheduled-production-directory-observation:
    needs: [validate-publication-sequence]
    if: github.event_name == 'schedule' || inputs.run_scheduled_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the exact deployed production ledger
        run: |
          marker_ref="$(python3 -c 'import json; print(json.load(open("registry/publication/production-marker.json"))["marker_ref"])')"
          production_commit="$(git ls-remote --refs origin "${marker_ref}" | awk '{ print $1 }')"
          if test -z "${production_commit}"; then
            bootstrap_sequence="$(python3 -c 'import json; print(json.load(open("registry/publication/production-marker.json"))["bootstrap_sequence"])')"
            tag_prefix="$(python3 -c 'import json; print(json.load(open("registry/publication/production-marker.json"))["sequence_tag_prefix"])')"
            bootstrap_ref="${tag_prefix}$(printf '%020d' "${bootstrap_sequence}")"
            production_commit="$(git ls-remote --refs origin "${bootstrap_ref}" | awk '{ print $1 }')"
          fi
          [[ "${production_commit}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "${production_commit}"
          git worktree add --detach _production-ledger "${production_commit}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned launch harness dependencies
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - name: Observe the current signed production identity without runtime claims
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from scripts.run_launch_evidence_e2e import (
              fetch_production_directory,
              production_identity_from_materialized_ledger,
              read_production_config,
          )

          config = read_production_config()
          identity = production_identity_from_materialized_ledger(
              Path("_production-ledger/registry/schemas/1")
          )
          with tempfile.TemporaryDirectory(prefix="uap-scheduled-production-") as tmp:
              environment, snapshot, digest = fetch_production_directory(
                  Path(tmp) / "directory",
                  expected_publication_id=identity["publication_id"],
                  expected_sequence=identity["sequence"],
                  expected_snapshot_digest=identity["snapshot_digest"],
                  expected_source_commit=identity["source_commit"],
              )
          if environment["AGENTPLUGINS_DIRECTORY_ORIGIN"] != config["production_origin"]:
              raise ValueError("production observation resolved an unexpected origin")
          observation = {
              "schema_version": 1,
              "origin": environment["AGENTPLUGINS_DIRECTORY_ORIGIN"],
              "publication_id": snapshot["publication_id"],
              "sequence": snapshot["sequence"],
              "snapshot_digest": digest,
              "source_commit": snapshot["source_commit"],
              "runtime_claims": False,
              "oauth_claims": False,
          }
          Path("/tmp/scheduled-production-directory.json").write_text(
              json.dumps(observation, indent=2, sort_keys=True) + "\n"
          )
          PY
          (cd /tmp && sha256sum scheduled-production-directory.json > scheduled-production-directory.SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-production-directory-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/scheduled-production-directory.json
            /tmp/scheduled-production-directory.SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          overwrite: false
