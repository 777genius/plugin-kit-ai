name: upstream Agent Plugins package E2E

on:
  workflow_dispatch:

permissions:
  attestations: read
  contents: read

env:
  AGENTPLUGINS_VERSION: "0.1.24"
  AGENTPLUGINS_COMMIT: c78c79e44efd5ad07083d63436d9170b107df6cb
  AGENTPLUGINS_NPM_INTEGRITY: sha512-hUMKvd2kAjTWA1obzAlXdbE3GxjRk8lhXRA9YuO2h2NINnYv/GQi2JwgkqWhOd95BpEKh5Do8vV1B4B/Unl+jw==
  CLAUDE_CODE_VERSION: "2.1.251"
  CLAUDE_CODE_NPM_INTEGRITY: sha512-eG+ZPPpW2Dbmnntf1Fz9/T9ewS8I8SKfc1tcU2PqSwmftfjRPP7BXPaCyLuZ8kvgTdiPnJi/2/JnTvTRieneEQ==
  CHROME_UPSTREAM_HEAD: 7e193aed8baa23c692355237a55237540b36cb2f

jobs:
  install-lifecycle:
    name: ${{ matrix.package.id }} on Codex, Cursor, and Kiro
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - id: chrome-devtools
            source: ChromeDevTools/chrome-devtools-mcp@7e193aed8baa23c692355237a55237540b36cb2f
            repository: ChromeDevTools/chrome-devtools-mcp
            revision: 7e193aed8baa23c692355237a55237540b36cb2f
            plugin: chrome-devtools
            version: 1.8.0
          - id: cloudflare-docs
            source: 777genius/mcp-server-cloudflare@3897acdb389b453205c559e2b79acc8bd5909bfa//apps/docs-ai-search/agent-plugin
            repository: 777genius/mcp-server-cloudflare
            revision: 3897acdb389b453205c559e2b79acc8bd5909bfa
            plugin: cloudflare-docs
            version: ""
          - id: github
            source: 777genius/github-mcp-server@14092de9940741511d224e0d7071ac02910bda11//agent-plugin
            repository: 777genius/github-mcp-server
            revision: 14092de9940741511d224e0d7071ac02910bda11
            plugin: github
            version: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download and authenticate the exact released CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "agentplugins-v${AGENTPLUGINS_VERSION}" \
            --repo 777genius/plugin-kit-ai \
            --pattern "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64" \
            --pattern checksums.txt \
            --pattern release-manifest.json \
            --dir "$RUNNER_TEMP/release"
          chmod +x "$RUNNER_TEMP/release/agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64"
          cd "$RUNNER_TEMP/release"
          test "$(sha256sum agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64 | cut -d ' ' -f 1)" = e79125f7ffabd11c6e211d6b049c2eb2b36eb1aba3a76ce27cac819aeba1e6ca
          test "$(sha256sum checksums.txt | cut -d ' ' -f 1)" = 623fb73d0e2f59da8b01399842b0d82b8f6456c6e43db2251c0ea5f9e32f37e3
          test "$(sha256sum release-manifest.json | cut -d ' ' -f 1)" = eb834da8237b13ed36061aeafb4fbb6f4aadeb5a6fbd4a31d43781f456f3d1e2
          sha256sum --check checksums.txt --ignore-missing
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("release-manifest.json").read_text())
          asset = manifest["assets"]["linux-amd64"]
          binary = Path(asset["file"])
          assert manifest["schema_version"] == 2
          assert manifest["tag"] == f"agentplugins-v{os.environ['AGENTPLUGINS_VERSION']}"
          assert manifest["version"] == os.environ["AGENTPLUGINS_VERSION"]
          assert manifest["commit"] == os.environ["AGENTPLUGINS_COMMIT"]
          assert asset["file"] == f"agentplugins_{os.environ['AGENTPLUGINS_VERSION']}_linux_amd64"
          assert asset["size"] == binary.stat().st_size
          assert asset["sha256"] == hashlib.sha256(binary.read_bytes()).hexdigest()
          PY
          for asset in "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64" checksums.txt release-manifest.json; do
            gh attestation verify "$asset" \
              --repo 777genius/plugin-kit-ai \
              --signer-workflow 777genius/plugin-kit-ai/.github/workflows/agentplugins-release.yml \
              --source-digest "$AGENTPLUGINS_COMMIT"
          done
          test "$(./agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64 version)" = "agentplugins ${AGENTPLUGINS_VERSION}"
      - name: Install, inspect, and remove from three disposable client homes
        env:
          SOURCE: ${{ matrix.package.source }}
          EXPECTED_REPOSITORY: ${{ matrix.package.repository }}
          EXPECTED_REVISION: ${{ matrix.package.revision }}
          EXPECTED_PLUGIN: ${{ matrix.package.plugin }}
          EXPECTED_VERSION: ${{ matrix.package.version }}
        run: |
          run_root="$RUNNER_TEMP/upstream-${{ matrix.package.id }}"
          mkdir -p "$run_root"/{home,state,workspace,config,cache,tmp,evidence}
          mkdir -p "$run_root/home"/{.codex,.cursor,.kiro}
          binary="$RUNNER_TEMP/release/agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64"
          isolated=(env -i PATH="$PATH" LANG=C.UTF-8 HOME="$run_root/home" USERPROFILE="$run_root/home" \
            XDG_CONFIG_HOME="$run_root/config" XDG_CACHE_HOME="$run_root/cache" \
            AGENTPLUGINS_HOME="$run_root/state" TMPDIR="$run_root/tmp" \
            GIT_CONFIG_GLOBAL="$run_root/home/.gitconfig" GIT_CONFIG_NOSYSTEM=1 \
            GIT_TERMINAL_PROMPT=0 CI=true)
          cd "$run_root/workspace"
          "${isolated[@]}" "$binary" add "$SOURCE" --target codex,cursor,kiro --format json > "$run_root/evidence/add.json"
          "${isolated[@]}" "$binary" info "$EXPECTED_PLUGIN" --target codex,cursor,kiro --format json > "$run_root/evidence/info.json"
          "${isolated[@]}" "$binary" remove "$EXPECTED_PLUGIN" --target codex,cursor,kiro --external-uninstalled --format json > "$run_root/evidence/remove.json"
          python3 - "$run_root/evidence" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          add = json.loads((root / "add.json").read_text())
          info = json.loads((root / "info.json").read_text())
          remove = json.loads((root / "remove.json").read_text())
          assert add["result"] == info["result"] == remove["result"] == "success"
          data = add["data"]
          assert data["plugin"] == os.environ["EXPECTED_PLUGIN"]
          expected_version = os.environ["EXPECTED_VERSION"]
          if expected_version:
              assert data.get("version") == expected_version
          else:
              assert not data.get("version")
          assert data["revision"] == os.environ["EXPECTED_REVISION"]
          assert data["succeeded"] == 3 and data["failed"] == 0
          assert {item["target"] for item in data["targets"]} == {"codex", "cursor", "kiro"}
          assert {item["status"] for item in data["targets"]} == {"external_completed"}
          assert remove["data"]["succeeded"] == 3 and remove["data"]["failed"] == 0
          evidence = {
              "schema_version": 1,
              "cli_version": os.environ["AGENTPLUGINS_VERSION"],
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "revision": data["revision"],
              "plugin": data["plugin"],
              "plugin_version": data.get("version") or None,
              "tree_digest": data["tree_digest"],
              "manifest_digest": data["manifest_digest"],
              "clients": sorted(item["target"] for item in data["targets"]),
              "install": "passed",
              "discovery": "passed",
              "remove": "passed",
              "client_detection": "empty_disposable_config_roots",
              "activation_executed": False,
              "runtime_executed": False,
              "authentication_executed": False,
              "run": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "source_commit": os.environ["GITHUB_SHA"],
              },
          }
          body = json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          (root / "evidence.json").write_text(body)
          (root / "evidence.sha256").write_text(hashlib.sha256(body.encode()).hexdigest() + "  evidence.json\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-package-${{ matrix.package.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upstream-${{ matrix.package.id }}/evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  chrome-five-client-lifecycle:
    name: Chrome DevTools on Claude, Gemini, OpenCode, Cline, and Windsurf
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install and authenticate exact public npm clients
        env:
          TOOLS_ROOT: ${{ runner.temp }}/chrome-five-client-tools
        run: |
          test "$(npm view "universal-agent-plugins@${AGENTPLUGINS_VERSION}" dist.integrity)" = "$AGENTPLUGINS_NPM_INTEGRITY"
          test "$(npm view "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" dist.integrity)" = "$CLAUDE_CODE_NPM_INTEGRITY"
          npm install --prefix "$TOOLS_ROOT" --no-audit --no-fund \
            "universal-agent-plugins@${AGENTPLUGINS_VERSION}" \
            "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          npm audit signatures --prefix "$TOOLS_ROOT"
          test "$(node -p "require('${TOOLS_ROOT}/node_modules/universal-agent-plugins/package.json').version")" = "$AGENTPLUGINS_VERSION"
          test "$(node -p "require('${TOOLS_ROOT}/node_modules/@anthropic-ai/claude-code/package.json').version")" = "$CLAUDE_CODE_VERSION"
          test "$("$TOOLS_ROOT/node_modules/.bin/agentplugins" version)" = "agentplugins ${AGENTPLUGINS_VERSION}"
          test "$("$TOOLS_ROOT/node_modules/.bin/claude" --version | cut -d ' ' -f 1)" = "$CLAUDE_CODE_VERSION"
      - name: Run the exact five-client lifecycle in fresh isolated roots
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_ROOT: ${{ runner.temp }}/chrome-five-client-tools
          EVIDENCE_ROOT: ${{ runner.temp }}/chrome-five-client-evidence
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          python3 scripts/run_chrome_five_client_lifecycle.py \
            --agentplugins "$TOOLS_ROOT/node_modules/.bin/agentplugins" \
            --agentplugins-package-root "$TOOLS_ROOT/node_modules/universal-agent-plugins" \
            --agentplugins-version "$AGENTPLUGINS_VERSION" \
            --agentplugins-npm-integrity "$AGENTPLUGINS_NPM_INTEGRITY" \
            --claude "$TOOLS_ROOT/node_modules/.bin/claude" \
            --claude-version "$CLAUDE_CODE_VERSION" \
            --claude-npm-integrity "$CLAUDE_CODE_NPM_INTEGRITY" \
            --node "$(command -v node)" \
            --npx "$(command -v npx)" \
            --git "$(command -v git)" \
            --gh "$(command -v gh)" \
            --expected-head "$CHROME_UPSTREAM_HEAD" \
            --sandbox "$RUNNER_TEMP/chrome-five-client-sandbox" \
            --output "$EVIDENCE_ROOT/evidence.json" \
            --run-repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-commit "$GITHUB_SHA"
          python3 -m pip install check-jsonschema==0.38.0
          check-jsonschema \
            --schemafile schemas/e2e/chrome-five-client-lifecycle.schema.json \
            "$EVIDENCE_ROOT/evidence.json"
          python3 scripts/validate_client_evidence.py --file "$EVIDENCE_ROOT/evidence.json"
          (cd "$EVIDENCE_ROOT" && sha256sum evidence.json > evidence.sha256)
          test ! -e "$RUNNER_TEMP/chrome-five-client-sandbox"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-five-client-lifecycle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chrome-five-client-evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false
