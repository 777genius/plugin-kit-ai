name: upstream Agent Plugins package E2E

on:
  workflow_dispatch:

permissions:
  attestations: read
  contents: read

env:
  AGENTPLUGINS_VERSION: "0.1.34"
  AGENTPLUGINS_COMMIT: 5ee12c478f7194686b30efbdac83b613a3f3d68a
  AGENTPLUGINS_NPM_INTEGRITY: sha512-x4LoUwRJpPHzYaOUMSo1lbGxxEPozJSMShGLI/qa4aOrvasIP/hjEVfYSEtSDmuGfhRpCnOfa0RCufrOmSkndg==
  CLAUDE_CODE_VERSION: "2.1.251"
  CLAUDE_CODE_NPM_INTEGRITY: sha512-eG+ZPPpW2Dbmnntf1Fz9/T9ewS8I8SKfc1tcU2PqSwmftfjRPP7BXPaCyLuZ8kvgTdiPnJi/2/JnTvTRieneEQ==
  CHROME_UPSTREAM_HEAD: 59380dd5c1af79973081d7b594262e86e24eb0b3

jobs:
  public-site:
    name: Public Pages desktop and mobile consumer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Check actual public Pages without fixtures or credentials
        run: |
          smoke_root="$RUNNER_TEMP/public-site-smoke"
          mkdir -p "$smoke_root"/{home,cache,tmp}
          cp site/package.json site/pnpm-lock.yaml site/pnpm-workspace.yaml site/scripts/check-public-site.mjs "$smoke_root/"
          env -i PATH="$PATH" HOME="$smoke_root/home" TMPDIR="$smoke_root/tmp" \
            XDG_CACHE_HOME="$smoke_root/cache" PLAYWRIGHT_BROWSERS_PATH="$smoke_root/browsers" \
            NPM_CONFIG_USERCONFIG="$smoke_root/home/user.npmrc" NPM_CONFIG_GLOBALCONFIG="$smoke_root/home/global.npmrc" \
            SMOKE_ROOT="$smoke_root" EVIDENCE_ROOT="$RUNNER_TEMP/public-site-evidence" CI=true \
            bash -euo pipefail <<'SH'
          cd "$SMOKE_ROOT"
          pnpm install --frozen-lockfile --ignore-scripts --store-dir "$SMOKE_ROOT/store"
          pnpm exec playwright install --with-deps chromium
          node check-public-site.mjs
          SH
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-site-evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  public-version-doctor:
    name: Public npm ${{ matrix.release.version }} read-only doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        release:
          - version: "0.1.34"
            integrity: sha512-x4LoUwRJpPHzYaOUMSo1lbGxxEPozJSMShGLI/qa4aOrvasIP/hjEVfYSEtSDmuGfhRpCnOfa0RCufrOmSkndg==
          - version: "0.1.26"
            integrity: sha512-7aPo4aoulltyx9zTbhJLxjCpQSvjKN0/YW/ATF6AUl2tnpWMwZf440SZbXfTGeuPRo0Ol2K5epNJFOguaPj7WQ==
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Pin the npm signature verifier
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = 12.0.2
      - name: Prove the exact public facade and read-only empty-state doctor
        env:
          VERSION: ${{ matrix.release.version }}
          INTEGRITY: ${{ matrix.release.integrity }}
        run: |
          proof_root="$RUNNER_TEMP/public-version-$VERSION"
          tools_root="$proof_root/tools"
          mkdir -p "$proof_root"/{home,state,workspace,config,cache,tmp,evidence} "$tools_root"
          env -i PATH="$PATH" LANG=C.UTF-8 HOME="$proof_root/home" USERPROFILE="$proof_root/home" \
            XDG_CONFIG_HOME="$proof_root/config" XDG_CACHE_HOME="$proof_root/cache" \
            AGENTPLUGINS_HOME="$proof_root/state" TMPDIR="$proof_root/tmp" \
            GIT_CONFIG_GLOBAL="$proof_root/home/.gitconfig" GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 CI=true \
            NPM_CONFIG_CACHE="$proof_root/cache/npm" NPM_CONFIG_USERCONFIG="$proof_root/home/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$proof_root/home/global.npmrc" NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
            VERSION="$VERSION" INTEGRITY="$INTEGRITY" PROOF_ROOT="$proof_root" TOOLS_ROOT="$tools_root" \
            python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          from pathlib import Path

          root = Path(os.environ["PROOF_ROOT"])
          tools = Path(os.environ["TOOLS_ROOT"])
          version = os.environ["VERSION"]
          integrity = os.environ["INTEGRITY"]
          env = dict(os.environ)

          def invoke(command, *, cwd=tools):
              return subprocess.run(command, env=env, cwd=cwd, check=True, capture_output=True,
                                    text=True, timeout=180)

          def snapshot():
              result = {}
              for name in ("home", "state", "workspace", "config", "cache", "tmp"):
                  base = root / name
                  for path in sorted([base, *base.rglob("*")], key=lambda item: str(item)):
                      relative = str(path.relative_to(root))
                      mode = stat.S_IMODE(path.lstat().st_mode)
                      if path.is_symlink():
                          result[relative] = ["symlink", mode, os.readlink(path)]
                      elif path.is_file():
                          result[relative] = ["file", mode, hashlib.sha256(path.read_bytes()).hexdigest()]
                      elif path.is_dir():
                          result[relative] = ["directory", mode]
              return result

          metadata = invoke(["npm", "view", f"universal-agent-plugins@{version}", "--json"])
          package = json.loads(metadata.stdout)
          if isinstance(package, list):
              assert len(package) == 1
              package = package[0]
          assert isinstance(package, dict)
          assert package["version"] == version and package["dist"]["integrity"] == integrity
          invoke(["npm", "install", "--prefix", str(tools), "--no-audit", "--no-fund",
                  f"universal-agent-plugins@{version}"])
          audit = invoke(["npm", "audit", "signatures", "--prefix", str(tools)])
          assert "audited" in audit.stdout.lower() or "verified" in audit.stdout.lower()
          binary = tools / "node_modules/.bin/agentplugins"
          assert invoke([str(binary), "version"], cwd=root / "workspace").stdout.strip() == f"agentplugins {version}"

          before = snapshot()
          completed = invoke([str(binary), "doctor", "--format", "json"], cwd=root / "workspace")
          report = json.loads(completed.stdout)
          assert report["command"] == "doctor" and report["result"] == "success"
          data = report["data"]
          assert data["read_only"] is True
          assert type(data["installation_count"]) is int and data["installation_count"] == 0
          assert type(data["open_operation_count"]) is int and data["open_operation_count"] == 0
          assert snapshot() == before

          evidence = {"schema_version": 1, "package": "universal-agent-plugins", "version": version,
                      "integrity": integrity, "npm_signature_audit": "passed", "doctor": "passed_read_only",
                      "managed_installations": 0, "open_operations": 0,
                      "source_commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          body = json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          output = root / "evidence/evidence.json"
          output.write_text(body)
          (root / "evidence/evidence.sha256").write_text(hashlib.sha256(body.encode()).hexdigest() + "  evidence.json\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-version-doctor-${{ matrix.release.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-version-${{ matrix.release.version }}/evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  install-lifecycle:
    name: ${{ matrix.package.id }} on Codex, Cursor, and Kiro
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - id: chrome-devtools
            source: ChromeDevTools/chrome-devtools-mcp@59380dd5c1af79973081d7b594262e86e24eb0b3
            repository: ChromeDevTools/chrome-devtools-mcp
            revision: 59380dd5c1af79973081d7b594262e86e24eb0b3
            plugin: chrome-devtools
            version: 1.8.0
          - id: cloudflare-docs
            source: 777genius/mcp-server-cloudflare@3897acdb389b453205c559e2b79acc8bd5909bfa//apps/docs-ai-search/agent-plugin
            repository: 777genius/mcp-server-cloudflare
            revision: 3897acdb389b453205c559e2b79acc8bd5909bfa
            plugin: cloudflare-docs
            version: ""
          - id: github
            source: 777genius/github-mcp-server@14092de9940741511d224e0d7071ac02910bda11//agent-plugin
            repository: 777genius/github-mcp-server
            revision: 14092de9940741511d224e0d7071ac02910bda11
            plugin: github
            version: ""
          - id: discovered-context7
            source: discovery:upstash/context7//plugins/agent-plugins/context7
            repository: upstash/context7
            plugin: context7
            version: 1.0.0
          - id: reviewed-chrome-short-alias
            source: chrome-devtools
            repository: 777genius/universal-agent-plugins
            revision: signed-directory-release
            plugin: chrome-devtools
            version: 1.7.0-uap.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Pin the npm signature verifier
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = 12.0.2
      - name: Download and authenticate the exact released CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "agentplugins-v${AGENTPLUGINS_VERSION}" \
            --repo 777genius/plugin-kit-ai \
            --pattern "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64" \
            --pattern checksums.txt \
            --pattern release-manifest.json \
            --dir "$RUNNER_TEMP/release"
          chmod +x "$RUNNER_TEMP/release/agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64"
          cd "$RUNNER_TEMP/release"
          test "$(sha256sum agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64 | cut -d ' ' -f 1)" = 0f1d5de082d79e8e109a5a822d863caafc48913916f43f211951af9c04988d4d
          test "$(sha256sum checksums.txt | cut -d ' ' -f 1)" = 5f0afce6498044369fa5076cdcefab2d82bffbbde309e6f98369c10d06209194
          test "$(sha256sum release-manifest.json | cut -d ' ' -f 1)" = 0547052ce2bf0e6788cf867c8182d8edff46aec076a51bf3019335f5de8d3aa3
          sha256sum --check checksums.txt --ignore-missing
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("release-manifest.json").read_text())
          asset = manifest["assets"]["linux-amd64"]
          binary = Path(asset["file"])
          assert manifest["schema_version"] == 2
          assert manifest["tag"] == f"agentplugins-v{os.environ['AGENTPLUGINS_VERSION']}"
          assert manifest["version"] == os.environ["AGENTPLUGINS_VERSION"]
          assert manifest["commit"] == os.environ["AGENTPLUGINS_COMMIT"]
          assert asset["file"] == f"agentplugins_{os.environ['AGENTPLUGINS_VERSION']}_linux_amd64"
          assert asset["size"] == binary.stat().st_size
          assert asset["sha256"] == hashlib.sha256(binary.read_bytes()).hexdigest()
          PY
          for asset in "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64" checksums.txt release-manifest.json; do
            gh attestation verify "$asset" \
              --repo 777genius/plugin-kit-ai \
              --signer-workflow 777genius/plugin-kit-ai/.github/workflows/agentplugins-release.yml \
              --source-digest "$AGENTPLUGINS_COMMIT"
          done
          test "$(./agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64 version)" = "agentplugins ${AGENTPLUGINS_VERSION}"
      - name: Install exact public npm wrapper without credentials
        run: |
          tools_root="$RUNNER_TEMP/upstream-npm"
          mkdir -p "$tools_root"/{home,cache,tmp}
          env -i PATH="$PATH" HOME="$tools_root/home" TMPDIR="$tools_root/tmp" \
            NPM_CONFIG_CACHE="$tools_root/cache" NPM_CONFIG_USERCONFIG="$tools_root/home/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$tools_root/home/global.npmrc" NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
            TOOLS_ROOT="$tools_root" AGENTPLUGINS_VERSION="$AGENTPLUGINS_VERSION" \
            AGENTPLUGINS_NPM_INTEGRITY="$AGENTPLUGINS_NPM_INTEGRITY" bash -euo pipefail <<'SH'
          cd "$TOOLS_ROOT"
          test "$(npm view "universal-agent-plugins@${AGENTPLUGINS_VERSION}" dist.integrity)" = "$AGENTPLUGINS_NPM_INTEGRITY"
          npm install --prefix "$TOOLS_ROOT" --no-audit --no-fund "universal-agent-plugins@${AGENTPLUGINS_VERSION}"
          npm audit signatures --prefix "$TOOLS_ROOT"
          test "$(node -p "require('${TOOLS_ROOT}/node_modules/universal-agent-plugins/package.json').version")" = "$AGENTPLUGINS_VERSION"
          SH
      - name: Prove isolated preparation, immutable update, and owned cleanup
        env:
          SOURCE: ${{ matrix.package.source }}
          EXPECTED_REPOSITORY: ${{ matrix.package.repository }}
          EXPECTED_REVISION: ${{ matrix.package.revision }}
          EXPECTED_PLUGIN: ${{ matrix.package.plugin }}
          EXPECTED_VERSION: ${{ matrix.package.version }}
        run: |
          run_root="$RUNNER_TEMP/upstream-${{ matrix.package.id }}"
          mkdir -p "$run_root"/{home,state,workspace,config,cache,tmp,evidence}
          mkdir -p "$run_root/home"/{.codex,.cursor,.kiro}
          binary="$RUNNER_TEMP/upstream-npm/node_modules/.bin/agentplugins"
          python3 -B - "$run_root" "$binary" "$GITHUB_WORKSPACE/scripts" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, sys.argv[3])
          from run_chrome_five_client_lifecycle import binary_digest, checked_json, ensure_sanitized, require_success, snapshot_roots, validate_doctor

          def exact_targets(data):
              assert type(data["succeeded"]) is int and data["succeeded"] == 3
              assert type(data["failed"]) is int and data["failed"] == 0
              assert len(data["targets"]) == 3
              assert {item["target"] for item in data["targets"]} == {"codex", "cursor", "kiro"}
              assert {item["status"] for item in data["targets"]} == {"external_completed"}

          def validate_update(value, stderr, mutable_selector):
              data = value["data"]
              if mutable_selector:
                  require_success(value, "update")
                  exact_targets(data)
                  assert data["status"] == "completed"
                  for target in data["targets"]:
                      result = target["output"]["result"]
                      assert result["mutated"] is False
                      # Manual client activation may remain pending, in which case the
                      # lifecycle result is non-mutating without claiming full convergence.
                      if "no_change" in result:
                          assert result["no_change"] is True
              else:
                  assert value["command"] == "update" and value["result"] == "failure"
                  assert data["status"] == "preflight_failed"
                  assert type(data["succeeded"]) is int and data["succeeded"] == 0
                  assert type(data["failed"]) is int and data["failed"] == 3
                  assert data["targets"] == []
                  assert "direct full-SHA installations require explicit switch" in stderr

          def validate_cleanup(sandbox, owned_paths, listed, doctor):
              assert require_success(listed, "list")["installations"] == []
              validate_doctor(doctor, post_remove=True)
              report = doctor["data"]
              for field in ("installation_count", "open_operation_count"):
                  assert type(report[field]) is int and report[field] == 0
              state = json.loads((sandbox / "state/state-v2.json").read_text())
              assert state["schema_version"] == 4 and state["installations"] in (None, [])
              assert owned_paths and all(not path.exists() and not path.is_symlink() for path in owned_paths)
              managed = sandbox / "state/managed"
              assert not any(path.is_file() or path.is_symlink() for path in managed.rglob("*"))
              plugin_data = sandbox / "state/plugin-data"
              assert not plugin_data.exists() or not any(plugin_data.iterdir())

          def discovery_identity(sandbox, source, data):
              cache = json.loads((sandbox / "state/discovery-v1-cache.json").read_text())
              snapshot = base64.b64decode(cache["snapshot"], validate=True)
              pointer = json.loads(base64.b64decode(cache["pointer"], validate=True))
              envelope = json.loads(base64.b64decode(cache["envelope"], validate=True))
              search_bytes = base64.b64decode(cache["search"], validate=True)
              search = json.loads(search_bytes)
              snapshot_data = json.loads(snapshot)
              digest = "sha256:" + hashlib.sha256(snapshot).hexdigest()
              assert type(cache["sequence"]) is int and cache["sequence"] >= 20
              assert cache["sequence"] == pointer["sequence"] == envelope["sequence"] == snapshot_data["sequence"] == search["sequence"]
              assert digest == envelope["snapshot_digest"]
              record_count = len(search["records"])
              projection = snapshot_data["search_projection"]
              assert snapshot_data["complete"] is True and record_count >= 2000
              assert type(projection["record_count"]) is int
              assert record_count == len(snapshot_data["records"]) == projection["record_count"]
              assert projection["digest"] == "sha256:" + hashlib.sha256(search_bytes).hexdigest()
              records = [record for record in search["records"] if record["slug"] == source]
              assert len(records) == 1
              record = records[0]
              assert record["repository"] == "upstash/context7" and record["package_path"] == "plugins/agent-plugins/context7"
              for field in ("revision", "tree_digest", "manifest_digest"):
                  assert record[field] == data[field]
              return {"sequence": cache["sequence"], "snapshot_digest": digest, "key_id": envelope["key_id"],
                      "record_count": record_count, "search_digest": projection["digest"]}

          def directory_identity(sandbox, data, installation):
              # Only inspect the production cache written and signature-verified by the released CLI.
              cache = json.loads((sandbox / "state/directory-v1-cache.json").read_text())
              raw = base64.b64decode(cache["snapshot"], validate=True)
              snapshot = json.loads(raw)
              envelope = json.loads(base64.b64decode(cache["envelope"], validate=True))
              digest = "sha256:" + hashlib.sha256(raw).hexdigest()
              sequence = cache["sequence"]
              assert type(sequence) is int and sequence >= 20
              assert sequence == snapshot["sequence"] == envelope["sequence"]
              assert digest == envelope["snapshot_digest"]
              product, = [item for item in snapshot["products"] if item["id"] == "chrome-devtools"]
              distribution, = [item for item in snapshot["distributions"] if item["id"] == "777genius/chrome-devtools-bridge"]
              assert distribution["id"] in product["distributions"]
              assert distribution["product_id"] == product["id"] and distribution["status"] == "active"
              assert distribution["kind"] == "community_bridge"
              declared, = [item for item in snapshot["distributions"] if item["id"] == product["default_distribution"]]
              assert declared["status"] == "suspended" and declared["id"] != distribution["id"]
              release, = [item for item in distribution["releases"] if item["sequence"] == 2]
              policy, = [item for item in distribution["release_policies"] if item["release_sequence"] == 2]
              assert policy["status"] == "active"
              assert release["package_version"] == data["version"] == "1.7.0-uap.1"
              assert release["tree_digest"] == data["tree_digest"] == "sha256:9ecf4bcd3eff01f3cb23a46838f65e5c9e213a29367514b320dc92aee98689ed"
              assert release["manifest_digest"] == data["manifest_digest"] == "sha256:38c1ccf9c0857300832c140caf1049aaaacaa09594011d45e68b85a416734265"
              source = release["package_source"]
              assert source["repository"] == "777genius/universal-agent-plugins" and source["path"] == "plugins/chrome-devtools"
              assert len(source["revision"]) == 40 and int(source["revision"], 16) >= 0
              assert data["revision"] == installation["source"]["resolved_revision"] == source["revision"]
              assert installation["source"]["package_subpath"] == source["path"]
              assert installation["origin_mode"] == "directory"
              expected = {"product_id": product["id"], "distribution_id": distribution["id"],
                          "distribution_kind": distribution["kind"], "desired_release_sequence": 2,
                          "snapshot_schema": snapshot["snapshot_schema_version"],
                          "snapshot_sequence": sequence, "snapshot_digest": digest}
              assert data["directory"] == installation["directory"] == expected
              return {**expected, "key_id": envelope["key_id"], "source": source,
                      "declared_default_distribution": declared["id"], "fallback_selected": True}

          sandbox = Path(sys.argv[1])
          root = sandbox / "evidence"
          roots = {name: sandbox / name for name in ("home", "state", "workspace", "config", "cache", "tmp")}
          env = {"PATH": os.environ["PATH"], "LANG": "C.UTF-8", "HOME": str(roots["home"]),
                 "USERPROFILE": str(roots["home"]), "XDG_CONFIG_HOME": str(roots["config"]),
                 "XDG_CACHE_HOME": str(roots["cache"]), "AGENTPLUGINS_HOME": str(roots["state"]),
                 "TMPDIR": str(roots["tmp"]), "GIT_CONFIG_GLOBAL": str(roots["home"] / ".gitconfig"),
                 "GIT_CONFIG_NOSYSTEM": "1", "GIT_TERMINAL_PROMPT": "0", "CI": "true"}
          def run(command, *args, success=True):
              return checked_json([sys.argv[2], command, *args, "--format", "json"],
                                  env=env, cwd=roots["workspace"], expect_success=success)

          source, plugin = os.environ["SOURCE"], os.environ["EXPECTED_PLUGIN"]
          discovered = source.startswith("discovery:")
          directory = source == "chrome-devtools"
          mutable_selector = discovered or directory
          version = subprocess.run([sys.argv[2], "version"], env=env, cwd=roots["workspace"],
                                   check=True, capture_output=True, text=True, timeout=120)
          assert version.stdout.strip() == "agentplugins " + os.environ["AGENTPLUGINS_VERSION"]
          package_root = Path(sys.argv[2]).parent.parent / "universal-agent-plugins"
          native_digest = binary_digest(roots["cache"], os.environ["AGENTPLUGINS_VERSION"], package_root)
          release_binary = Path(os.environ["RUNNER_TEMP"]) / "release" / f"agentplugins_{os.environ['AGENTPLUGINS_VERSION']}_linux_amd64"
          assert native_digest == "sha256:" + hashlib.sha256(release_binary.read_bytes()).hexdigest()
          common = ["--target", "codex,cursor,kiro"]
          add, _, _ = run("add", source, *common)
          info, _, _ = run("info", plugin, *common)
          data = require_success(add, "add")
          inspected = require_success(info, "info")
          assert data["plugin"] == os.environ["EXPECTED_PLUGIN"]
          expected_version = os.environ["EXPECTED_VERSION"]
          if expected_version:
              assert data.get("version") == expected_version
          else:
              assert not data.get("version")
          if not directory and not discovered:
              assert data["revision"] == os.environ["EXPECTED_REVISION"]
          exact_targets(data)
          acquisition = data["acquisition"]
          assert type(acquisition["acquisition_count"]) is int and acquisition["acquisition_count"] == 1
          assert acquisition["fetched"] is True and acquisition["validated"] is True
          assert set(data["target_outcomes"]) == {"codex", "cursor", "kiro"}
          for outcome in data["target_outcomes"].values():
              assert outcome["outcome"] == "passed"
              for field in ("acquisition_id", "tree_digest", "manifest_digest", "closure_digest"):
                  assert outcome[field] == acquisition[field]
          state_file = roots["state"] / "state-v2.json"
          installed = json.loads(state_file.read_text())["installations"]
          assert len(installed) == 1
          installation = installed[0]
          assert installation["installation_id"] == inspected["installation_id"]
          assert {item["output"]["result"]["installation_id"] for item in data["targets"]} == {installation["installation_id"]}
          assert installation["source"]["repository"] == os.environ["EXPECTED_REPOSITORY"]
          assert installation["source"]["resolved_revision"] == data["revision"]
          for field in ("tree_digest", "manifest_digest"):
              assert acquisition[field] == data[field]
          bindings = list(installation["clients"].values())
          assert len(bindings) == 3 and {item["client_id"] for item in bindings} == {"codex", "cursor", "kiro"}
          owned_paths = [Path(item["target_locator"]) for item in bindings]
          assert all(path.is_relative_to(sandbox) and path != sandbox and path.exists() for path in owned_paths)
          discovery_before = discovery_identity(sandbox, source, data) if discovered else None
          directory_before = directory_identity(sandbox, data, installation) if directory else None
          if discovered:
              assert installation["origin_mode"] == "direct" and not installation.get("directory")
              assert installation["source"]["requested_source"] == installation["source"]["canonical_source"] == source
          # Signed selectors may refresh verified caches; installed state and client artifacts must not change.
          immutable_roots = roots if not mutable_selector else {name: path for name, path in roots.items() if name != "state"}
          if mutable_selector:
              immutable_roots.update({f"owned_{index}": path for index, path in enumerate(owned_paths)})
              plugin_data = roots["state"] / "plugin-data"
              if plugin_data.is_dir():
                  immutable_roots["plugin_data"] = plugin_data
          state_before = state_file.read_bytes()
          before = snapshot_roots(immutable_roots)
          update, update_stderr, _ = run("update", plugin, *common, success=mutable_selector)
          validate_update(update, update_stderr, mutable_selector)
          assert state_file.read_bytes() == state_before and snapshot_roots(immutable_roots) == before
          discovery_after = discovery_identity(sandbox, source, data) if discovered else None
          directory_after = directory_identity(sandbox, data, installation) if directory else None
          remove, _, _ = run("remove", plugin, *common, "--external-uninstalled", "--purge-data")
          removed = require_success(remove, "remove")
          exact_targets(removed)
          assert removed["plugin_data_preserved"] is False and removed["data_retained"] is False
          listed, _, _ = run("list")
          final_before = snapshot_roots(roots)
          doctor, _, _ = run("doctor")
          assert snapshot_roots(roots) == final_before
          validate_cleanup(sandbox, owned_paths, listed, doctor)
          evidence = {
              "schema_version": 1,
              "cli_version": os.environ["AGENTPLUGINS_VERSION"],
              "npm_package": "universal-agent-plugins",
              "npm_integrity": os.environ["AGENTPLUGINS_NPM_INTEGRITY"],
              "native_binary_digest": native_digest,
              "native_binary_matches_attested_release": True,
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "revision": data["revision"],
              "plugin": data["plugin"],
              "plugin_version": data.get("version") or None,
              "tree_digest": data["tree_digest"],
              "manifest_digest": data["manifest_digest"],
              "clients": sorted(item["target"] for item in data["targets"]),
              "install": "passed",
              "package_preparation": "passed",
              "manager_inspection": "passed",
              "signed_discovery_selector_resolution": discovered,
              "discovery_before_update": discovery_before,
              "discovery_after_update": discovery_after,
              "signed_directory_short_alias_resolution": directory,
              "directory_before_update": directory_before,
              "directory_after_update": directory_after,
              "update": "passed_no_mutation" if mutable_selector else "blocked_immutable_full_sha_no_mutation",
              "version_upgrade_executed": False,
              "single_acquisition": True,
              "shared_installation_identity": True,
              "installation_state_unchanged_by_update": True,
              "remove": "passed",
              "owned_artifacts_removed": True,
              "owned_plugin_data_purged": True,
              "final_doctor_read_only": True,
              "managed_installations_remaining": 0,
              "open_operations_remaining": 0,
              "client_detection": "empty_disposable_config_roots",
              "activation_executed": False,
              "runtime_executed": False,
              "authentication_executed": False,
              "run": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "source_commit": os.environ["GITHUB_SHA"],
              },
          }
          ensure_sanitized(evidence, sandbox)
          body = json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          (root / "evidence.json").write_text(body)
          (root / "evidence.sha256").write_text(hashlib.sha256(body.encode()).hexdigest() + "  evidence.json\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-package-${{ matrix.package.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/upstream-${{ matrix.package.id }}/evidence/evidence.json
            ${{ runner.temp }}/upstream-${{ matrix.package.id }}/evidence/evidence.sha256
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  chrome-five-client-lifecycle:
    name: Chrome DevTools on Claude, Gemini, OpenCode, Cline, and Windsurf
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Pin the npm signature verifier
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = 12.0.2
      - name: Install and authenticate exact public npm clients
        env:
          TOOLS_ROOT: ${{ runner.temp }}/chrome-five-client-tools
        run: |
          test "$(npm view "universal-agent-plugins@${AGENTPLUGINS_VERSION}" dist.integrity)" = "$AGENTPLUGINS_NPM_INTEGRITY"
          test "$(npm view "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" dist.integrity)" = "$CLAUDE_CODE_NPM_INTEGRITY"
          npm install --prefix "$TOOLS_ROOT" --no-audit --no-fund \
            "universal-agent-plugins@${AGENTPLUGINS_VERSION}" \
            "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          npm audit signatures --prefix "$TOOLS_ROOT"
          test "$(node -p "require('${TOOLS_ROOT}/node_modules/universal-agent-plugins/package.json').version")" = "$AGENTPLUGINS_VERSION"
          test "$(node -p "require('${TOOLS_ROOT}/node_modules/@anthropic-ai/claude-code/package.json').version")" = "$CLAUDE_CODE_VERSION"
          test "$("$TOOLS_ROOT/node_modules/.bin/agentplugins" version)" = "agentplugins ${AGENTPLUGINS_VERSION}"
          node "$TOOLS_ROOT/node_modules/@anthropic-ai/claude-code/install.cjs"
          test "$("$TOOLS_ROOT/node_modules/.bin/claude" --version | cut -d ' ' -f 1)" = "$CLAUDE_CODE_VERSION"
      - name: Run the exact five-client lifecycle in fresh isolated roots
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_ROOT: ${{ runner.temp }}/chrome-five-client-tools
          EVIDENCE_ROOT: ${{ runner.temp }}/chrome-five-client-evidence
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          python3 scripts/run_chrome_five_client_lifecycle.py \
            --agentplugins "$TOOLS_ROOT/node_modules/.bin/agentplugins" \
            --agentplugins-package-root "$TOOLS_ROOT/node_modules/universal-agent-plugins" \
            --agentplugins-version "$AGENTPLUGINS_VERSION" \
            --agentplugins-npm-integrity "$AGENTPLUGINS_NPM_INTEGRITY" \
            --claude "$TOOLS_ROOT/node_modules/.bin/claude" \
            --claude-version "$CLAUDE_CODE_VERSION" \
            --claude-npm-integrity "$CLAUDE_CODE_NPM_INTEGRITY" \
            --node "$(command -v node)" \
            --npx "$(command -v npx)" \
            --git "$(command -v git)" \
            --gh "$(command -v gh)" \
            --expected-head "$CHROME_UPSTREAM_HEAD" \
            --sandbox "$RUNNER_TEMP/chrome-five-client-sandbox" \
            --output "$EVIDENCE_ROOT/evidence.json" \
            --run-repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-commit "$GITHUB_SHA"
          python3 -m pip install check-jsonschema==0.38.0
          check-jsonschema \
            --schemafile schemas/e2e/chrome-five-client-lifecycle.schema.json \
            "$EVIDENCE_ROOT/evidence.json"
          python3 scripts/validate_client_evidence.py --file "$EVIDENCE_ROOT/evidence.json"
          (cd "$EVIDENCE_ROOT" && sha256sum evidence.json > evidence.sha256)
          test ! -e "$RUNNER_TEMP/chrome-five-client-sandbox"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-five-client-lifecycle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chrome-five-client-evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false
