name: Pages PR validation (non-production)

on:
  pull_request:
    paths:
      - "site/**"
      - "registry/**"
      - "schemas/registry-*.schema.json"
      - "scripts/build_registry.py"
      - "tests/test_build_registry.py"
      - ".github/workflows/pages.yml"
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install Python validation dependencies
        run: python3 -m pip install check-jsonschema==0.37.4 cryptography==46.0.3 jsonschema==4.25.1 PyYAML==6.0.3
      - name: Install the current stable Ubuntu bubblewrap package and record namespace policy
        run: |
          test "$RUNNER_OS" = Linux
          sudo apt-get update
          candidate="$(apt-cache policy bubblewrap | awk '$1 == "Candidate:" {print $2}')"
          test -n "$candidate"
          test "$candidate" != '(none)'
          sudo apt-get install --yes --no-install-recommends "bubblewrap=$candidate"
          test "$(dpkg-query -W -f='${Version}' bubblewrap)" = "$candidate"
          /usr/bin/bwrap --version
          uname -r
          for setting in /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/user/max_user_namespaces; do
            if test -r "$setting"; then printf '%s=' "$setting"; cat "$setting"; fi
          done
      - name: Allow user namespaces only for the root-owned bubblewrap executable
        id: isolation_profile
        run: |
          test "$RUNNER_OS" = Linux
          test "$GITHUB_ACTIONS" = true
          test -f /usr/bin/bwrap
          test ! -L /usr/bin/bwrap
          test "$(stat -c '%U:%G:%a' /usr/bin/bwrap)" = root:root:755
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          profile=/etc/apparmor.d/uap-catalog-bwrap
          test ! -e "$profile"
          test ! -L "$profile"
          if sudo grep -R -q -F /usr/bin/bwrap /etc/apparmor.d; then
            echo "An existing bubblewrap AppArmor policy requires review" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          if sudo grep -q '^uap-catalog-bwrap ' /sys/kernel/security/apparmor/profiles; then
            echo "The catalog AppArmor profile is already loaded" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          sudo /usr/sbin/apparmor_parser --skip-kernel-load --skip-cache tests/e2e/catalog-bwrap.apparmor
          echo "profile_owned=true" >> "$GITHUB_OUTPUT"
          sudo install -o root -g root -m 0644 tests/e2e/catalog-bwrap.apparmor "$profile"
          test "$(stat -c '%U:%G:%a' "$profile")" = root:root:644
          sudo /usr/sbin/apparmor_parser --add --skip-cache "$profile"
      - name: Require Linux child confinement before the full Python suite
        run: python3 -m unittest tests.test_catalog_process_isolation -v
      - name: Validate deterministic registry and Python suite
        run: |
          python3 scripts/build_registry.py --check
          python3 -m unittest discover -s tests
      - name: Validate registry JSON schemas and workflow YAML
        run: |
          check-jsonschema --schemafile schemas/registry-index.schema.json registry/index.json
          if compgen -G 'registry/entries/*.json' > /dev/null; then
            check-jsonschema --schemafile schemas/registry-entry.schema.json registry/entries/*.json
          fi
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit site dependencies
        working-directory: site
        run: pnpm audit --audit-level=low
      - name: Lint, test, and typecheck
        working-directory: site
        run: |
          pnpm lint
          pnpm test
          pnpm typecheck
      - name: Generate Pages site
        working-directory: site
        env:
          NUXT_APP_BASE_URL: /universal-agent-plugins/
          NUXT_PUBLIC_SITE_URL: https://777genius.github.io/universal-agent-plugins
          NUXT_PUBLIC_DISCOVERY_KEY_ID: test-discovery
          NUXT_PUBLIC_DISCOVERY_PUBLIC_KEY: ebVWLo/mVPlAeLES6KmLp5AfhTrmlb7X4OORC60ElmQ=
        run: |
          pnpm generate
          pnpm check:generated
      - name: Install Chromium for production browser tests
        working-directory: site
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise finalized Pages output in Chromium
        working-directory: site
        run: pnpm test:browser
      - name: Remove only this job's ephemeral AppArmor allowance
        if: ${{ always() && steps.isolation_profile.outputs.profile_owned == 'true' }}
        run: |
          profile=/etc/apparmor.d/uap-catalog-bwrap
          if test ! -e "$profile" && test ! -L "$profile"; then exit 0; fi
          test -f "$profile"
          test ! -L "$profile"
          status=0
          sudo /usr/sbin/apparmor_parser --remove --skip-cache "$profile" || status=$?
          sudo rm -- "$profile"
          exit "$status"
